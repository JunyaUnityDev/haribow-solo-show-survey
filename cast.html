<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO BEYOND ｜ 出演者ページ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{
  --bg:#0a0b0e; --panel:#14161c; --panel2:#1a1d25; --line:rgba(255,255,255,.09);
  --ink:#f3f1ea; --dim:#a7adba; --faint:#6b7280;
  --teal:#63b6cc; --cream:#f0ece0; --green:#6ba583; --amber:#c08f4a;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";-webkit-font-smoothing:antialiased;line-height:1.65}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 100px}

.top{padding:20px 0 4px}
.logomark{display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fbf9f3,#efeadc);border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);overflow:hidden}
.logomark img{height:74px;width:74px;display:block}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:16px 0 6px}
h1{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:.02em}
.venue{color:var(--dim);font-size:12.5px;margin:0}

.sticky{position:sticky;top:0;z-index:30;background:rgba(10,11,14,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:14px -16px 0;padding:9px 16px;
  display:flex;align-items:center;gap:12px;font-size:12px}
.sticky .dday{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.sticky .dday small{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.08em;margin-right:5px}
.sticky .seatmini{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.sticky .seatmini b{color:var(--teal);font-size:14px}
.reload{border:1px solid rgba(99,182,204,.32);background:rgba(99,182,204,.10);color:var(--teal);
  border-radius:100px;padding:5px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;
  white-space:nowrap;flex-shrink:0}
.reload:disabled{opacity:.5;cursor:default}
.reload .spin{display:inline-block}
.reload.busy .spin{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

h2{font-size:13px;font-weight:800;margin:32px 0 12px;letter-spacing:.05em;
  display:flex;align-items:center;gap:9px;color:var(--cream)}
h2::before{content:"";width:16px;height:2px;background:var(--teal);flex-shrink:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:12px}
.muted{color:var(--faint);font-size:12.5px}

/* 客席 */
.hero{background:linear-gradient(170deg,#161a22,#101217 60%);border:1px solid rgba(99,182,204,.20);
  border-radius:16px;padding:20px 18px;box-shadow:var(--shadow)}
.hero-lead{font-size:13px;color:var(--dim);margin:0 0 3px}
.hero-big{font-size:clamp(26px,7.5vw,38px);font-weight:800;line-height:1.15;margin:0 0 4px;font-variant-numeric:tabular-nums}
.hero-big .unit{font-size:.5em;font-weight:700;color:var(--dim);margin-left:3px}
.hero-sub{font-size:13px;color:var(--dim);margin:0}
.hero-sub b{color:var(--cream)}
.stage{margin:20px 0 11px;text-align:center}
.stage-bar{display:inline-block;width:56%;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.75}
.stage-label{font-size:9.5px;letter-spacing:.34em;color:var(--teal);text-transform:uppercase;margin-top:6px;font-weight:700}
.seatmap{display:flex;flex-direction:column;gap:3px;margin:12px 0 4px}
.seatrow{display:flex;gap:2px;justify-content:center}
.seat{flex:1 1 0;max-width:13px;height:7px;border-radius:1.5px;background:rgba(255,255,255,.055)}
.seat.taken{background:var(--teal);box-shadow:0 0 5px rgba(99,182,204,.75)}
.seatmap-cap{font-size:11px;color:var(--faint);text-align:center;margin:9px 0 0;line-height:1.5}

/* 全体の合計 */
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tot{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:11px 8px;text-align:center}
.tot .k{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.04em}
.tot .v{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.tot.bought .v{color:var(--green)}
.reach{margin-top:14px;padding:11px 13px;border-radius:10px;background:rgba(99,182,204,.09);
  border:1px solid rgba(99,182,204,.25);font-size:12.5px;color:#cfe6ee;line-height:1.6}
.reach b{color:#fff}

/* 名前選択 */
.namebar{display:flex;flex-wrap:wrap;gap:6px}
.namebar button{font-size:12.5px;font-weight:700;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:100px;padding:7px 14px;cursor:pointer;font-family:inherit}
.namebar button:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.namebar button.on{background:var(--teal);border-color:var(--teal);color:#06222b}

/* 自分の持ち場 */
.mine{border:1px solid rgba(99,182,204,.3);background:linear-gradient(170deg,#151b21,#111318)}
.mine-name{font-size:19px;font-weight:800;margin:0 0 2px;letter-spacing:.02em}
.mine-acts{font-size:11.5px;color:var(--faint);margin:0 0 15px;line-height:1.5}
.target{padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.04);margin-bottom:15px}
.target .k{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.05em}
.target .v{font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.target .v small{font-size:12px;font-weight:600;color:var(--dim);margin-left:3px}
.target .note{font-size:11.5px;color:var(--dim);margin-top:5px;line-height:1.55}
.target.unknown .v{color:var(--amber);font-size:15px}
.qlink{display:inline-block;margin-top:8px;color:var(--teal);font-weight:700;text-decoration:none;
  border:1px solid rgba(99,182,204,.32);border-radius:100px;padding:5px 13px;font-size:11.5px}
.qlink:hover{background:rgba(99,182,204,.1)}

.counter{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.counter:last-of-type{border-bottom:none}
.counter-l{flex:1;min-width:0}
.counter-l .k{font-size:13.5px;font-weight:700}
.counter-l .d{font-size:11px;color:var(--faint);margin-top:1px;line-height:1.45}
.step{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font-size:19px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.step:active{background:var(--teal);color:#06222b}
.step:disabled{opacity:.3}
.cval{font-size:22px;font-weight:800;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}

/* URL・文面 */
.copybox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-top:12px}
.copybox .k{font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.05em;margin-bottom:7px}
.copybox .u{font-size:13px;color:var(--teal);word-break:break-all;font-weight:600}
.copybox textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font-family:inherit;font-size:13px;line-height:1.75;padding:11px 12px;
  resize:vertical;min-height:150px;margin-top:2px}
.copybtn{width:100%;margin-top:9px;background:var(--teal);color:#06222b;border:0;border-radius:10px;
  padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.copybtn.ghost{background:rgba(99,182,204,.13);color:var(--teal);border:1px solid rgba(99,182,204,.3)}

.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:9px 0 9px 34px;font-size:13px;
  color:var(--dim);border-bottom:1px solid var(--line);line-height:1.6}
.steps li:last-child{border-bottom:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:22px;height:22px;
  border-radius:50%;background:rgba(99,182,204,.16);color:var(--teal);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--ink)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cream);color:#0a0b0e;
  font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:22px;opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:60;max-width:88vw;text-align:center}
.toast.show{opacity:.97}
.err{color:#c8433a;text-align:center;padding:44px 20px}

@media(max-width:400px){ .seat{height:6px} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="logomark"><img src="assets/go-beyond-logo.png" alt="HARIBOW単独公演 Go Beyond"></span>
    <p class="eyebrow">Solo Show 2026 — Cast</p>
    <h1>出演者ページ</h1>
    <p class="venue">2026.9.29（火）夜　めぐろパーシモンホール 大ホール</p>
  </div>

  <div class="sticky">
    <div class="dday" id="dday"><small>本番まで</small>—</div>
    <div class="seatmini" id="seatmini"></div>
    <button class="reload" id="reload" onclick="reload()"><span class="spin">↻</span> 更新</button>
  </div>

  <div id="content">
    <h2>いま、客席はこうなっています</h2>
    <div id="hero"></div>

    <h2>出演者みんなの合計</h2>
    <div class="card" id="totals"></div>

    <h2>あなたの持ち場</h2>
    <div class="namebar" id="namebar"></div>
    <div id="mine"></div>

    <h2>このページの使い方</h2>
    <div class="card">
      <ol class="steps">
        <li><b>声をかける相手を決めます。</b>家族・友だち・バイト先・学校など</li>
        <li><b>リンクと文面をコピーして送ります。</b>文面は自由に書き換えられます</li>
        <li><b>送ったら数字を増やします。</b>全体の合計にそのまま反映されます</li>
      </ol>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * 単独公演「GO BEYOND」出演者ページ（集客の持ち場）
 *
 * 運営向け dashboard.html とは別物。意図的に見せないものがある：
 *   - 金額（赤字額・必要稼働率・予算リンク）は一切出さない。
 *     達成不可能に見える目標は行動を止めるため（2026-07-27 JUNYA決定）
 *   - ランキングは作らない。順位はやる気を削ぐので、自分の持ち場と全体への貢献で見せる
 *   - 「送る相手の名前」は扱わない。1本のURLを31名で共有する方式のため、
 *     ここを載せると他人の友人・家族の実名が全員に見えてしまう
 *   - WBSのタスク・担当者・遅延は出さない（出演者に運営の内部事情は不要）
 *
 * 書き込みは GAS の cast_update だけ。運営用の ADMIN_SECRET は持たせておらず、
 * 触れるのは『URL配布_持ち場』シートの3列（送付済み/返事あり/購入確認）に限定される。
 * ========================================================================= */

var BASE = 'https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var ENDPOINT = BASE + '?page=cast';
var CAST_SECRET = 'hbw-2026-cast-s1udbmrnoy';
var SHOW_DATE = new Date(2026, 8, 29);
var FALLBACK_URL = 'https://go-beyond.haribow.com';
/* 動員見込みアンケート。未回答の人がここから直接答えられるようにする
   （催促の文言を並べるより、その場で開けるほうが早い） */
var SURVEY_URL = 'https://junyaunitydev.github.io/haribow-solo-show-survey/member.html';

var data = null;
var selected = null;
try { selected = localStorage.getItem('hbw_cast_name') || null; } catch(e){}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today0(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },1900);
}
function copyText(text, okMsg){
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg); }
    catch(e){ toast('コピーできませんでした。長押しで選択してください'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(okMsg); }, fallback);
  } else fallback();
}

/* ----------------------------------------------------------- 客席 */
function renderHero(){
  var s=data.seats;
  var daysLeft=Math.max(0, Math.round((SHOW_DATE-today0())/86400000));
  document.getElementById('dday').innerHTML='<small>本番まで</small>'+daysLeft+'日';

  var el=document.getElementById('hero');
  if(!(s&&s.ok&&s.sellable>0)){
    el.innerHTML='<div class="card"><p class="muted">客席の状況を取得できませんでした。</p></div>';
    return;
  }
  document.getElementById('seatmini').innerHTML='客席 <b>'+s.taken+'</b> / '+s.sellable+'席';

  var seatmap=(s.rows||[]).map(function(row){
    var cells='';
    /* 席番号で塗る。個数だけで塗ると中央の席が売れていても左端が埋まって見える。
       番号が取れない場合だけ、従来どおり左から順に塗る。 */
    if(row.nums && row.nums.length){
      var takenSet={};
      (row.takenNums||[]).forEach(function(n){ takenSet[n]=1; });
      row.nums.forEach(function(n){
        cells+='<div class="seat'+(takenSet[n]?' taken':'')+'"></div>';
      });
    }else{
      for(var i=0;i<row.sellable;i++) cells+='<div class="seat'+(i<row.taken?' taken':'')+'"></div>';
    }
    return '<div class="seatrow">'+cells+'</div>';
  }).join('');

  el.innerHTML='<div class="hero">'+
    '<p class="hero-lead">埋まった席</p>'+
    '<p class="hero-big">'+s.taken+'<span class="unit">/ '+s.sellable+'席</span></p>'+
    '<p class="hero-sub">この客席を、9/29に<b>満席にしたいです</b>。</p>'+
    '<div class="stage"><div class="stage-bar"></div><div class="stage-label">Stage</div></div>'+
    '<div class="seatmap">'+seatmap+'</div>'+
    '<p class="seatmap-cap">光っているのが、もう買われた席です</p>'+
  '</div>';
}

/* ------------------------------------------------- 出演者みんなの合計 */
function renderTotals(){
  var t=data.totals, s=data.seats;
  var reach='';
  if(t.target>0 && s && s.ok && s.sellable>0){
    var pct=Math.round(t.target/s.sellable*100);
    reach='<div class="reach">出演者'+t.people+'人が「来そう」と答えた人数の合計は <b>'+t.target+'人</b>です。'+
      '全員に届けば、客席の <b>'+pct+'%</b> が埋まります。</div>';
  }
  document.getElementById('totals').innerHTML=
    '<div class="totals">'+
      '<div class="tot"><div class="k">送った</div><div class="v">'+t.sent+'</div></div>'+
      '<div class="tot"><div class="k">行くと返事</div><div class="v">'+t.replied+'</div></div>'+
      '<div class="tot bought"><div class="k">買ってくれた</div><div class="v">'+t.bought+'</div></div>'+
    '</div>'+reach;
}

/* ------------------------------------------------------- 名前選択 */
function selectName(name){
  selected = (selected===name) ? null : name;
  try{
    if(selected) localStorage.setItem('hbw_cast_name', selected);
    else localStorage.removeItem('hbw_cast_name');
  }catch(e){}
  renderNames();
  renderMine();
  if(selected){
    var el=document.getElementById('mine');
    if(el) el.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}
function renderNames(){
  document.getElementById('namebar').innerHTML=(data.people||[]).map(function(p){
    return '<button class="'+(selected===p.name?'on':'')+'" '+
      'onclick="selectName(\''+esc(p.name).replace(/'/g,"\\'")+'\')">'+esc(p.name)+'</button>';
  }).join('');
}

/* ----------------------------------------------------- 自分の持ち場 */
function findPerson(name){
  var list=data.people||[];
  for(var i=0;i<list.length;i++) if(list[i].name===name) return list[i];
  return null;
}
function bump(field, delta){
  var p=findPerson(selected);
  if(!p) return;
  var next=Math.max(0, (Number(p[field])||0)+delta);
  if(next===p[field]) return;
  p[field]=next;                 // 先に画面を動かす（体感速度優先）
  renderMine(); renderTotalsFromPeople();

  fetch(BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({survey:'cast_update',secret:CAST_SECRET,rowIndex:p.row,field:field,value:next})})
    .then(function(r){ return r.json(); })
    .then(function(res){ if(!res.ok) toast('保存できませんでした：'+(res.error||'')); })
    .catch(function(e){ toast('保存できませんでした。もう一度試してください'); });
}
/* ローカルで数字を動かしたあと、合計も即座に引き直す（再読込を待たせない） */
function renderTotalsFromPeople(){
  var t={people:(data.people||[]).length,target:0,sent:0,replied:0,bought:0};
  (data.people||[]).forEach(function(p){
    t.target+=p.target; t.sent+=p.sent; t.replied+=p.replied; t.bought+=p.bought;
  });
  data.totals=t;
  renderTotals();
}

function messageTemplate(p){
  return '9/29(火)の夜、HARIBOWの単独公演に出ます。\n'+
    'めぐろパーシモンホールの大ホールです。\n\n'+
    'チケットはここから買えます。\n'+
    (p.url||FALLBACK_URL)+'\n\n'+
    '来てくれたら嬉しいです。';
}

function counter(field, label, desc, val){
  return '<div class="counter">'+
    '<div class="counter-l"><div class="k">'+label+'</div><div class="d">'+desc+'</div></div>'+
    '<button class="step" onclick="bump(\''+field+'\',-1)"'+(val<=0?' disabled':'')+'>−</button>'+
    '<div class="cval">'+val+'</div>'+
    '<button class="step" onclick="bump(\''+field+'\',1)">＋</button>'+
  '</div>';
}

function renderMine(){
  var el=document.getElementById('mine');
  if(!selected){ el.innerHTML=''; return; }
  var p=findPerson(selected);
  if(!p){ el.innerHTML=''; return; }

  /* その他/SNS経由は目標に足していない（名前を挙げられる相手と人数感を混ぜないため）。
     ただし答えたものが画面から消えると「答えたのに0人扱い」に見えるので参考値として出す。 */
  var snsNote = p.sns>0
    ? '<div class="note">ほかに、SNS経由で <b>'+p.sns+'人</b> と回答しています（人数感のため合計には入れていません）。</div>'
    : '';

  var targetHtml = p.target>0
    ? '<div class="target"><div class="k">あなたが「来そう」と答えた人数</div>'+
      '<div class="v">'+p.target+'<small>人</small></div>'+
      '<div class="note">7/6のヒアリングでの回答です。ノルマではありません。</div>'+snsNote+'</div>'
    : '<div class="target unknown"><div class="k">あなたが「来そう」と答えた人数</div>'+
      '<div class="v">'+(p.sns>0?'家族・友人は0人と回答':'回答がまだありません')+'</div>'+
      '<div class="note">'+(p.sns>0
        ? 'SNS経由は '+p.sns+'人 と回答しています。変わっていれば、アンケートから直せます。'
        : 'アンケートに答えると、ここに人数が出ます。')+
        '<a class="qlink" href="'+SURVEY_URL+'" target="_blank" rel="noopener">アンケートを開く →</a>'+
      '</div></div>';

  var msg=messageTemplate(p);
  el.innerHTML='<div class="card mine">'+
    '<p class="mine-name">'+esc(p.name)+'</p>'+
    '<p class="mine-acts">'+esc(p.acts||'')+'</p>'+
    targetHtml+
    counter('sent',    '送った人数',       'リンクを送った相手の数', p.sent)+
    counter('replied', '「行く」と返事あり','来ると返事をもらった数', p.replied)+
    counter('bought',  '買ってくれた人数', '購入を確認できた数', p.bought)+

    '<div class="copybox">'+
      '<div class="k">送るリンク</div>'+
      '<div class="u">'+esc(p.url||FALLBACK_URL)+'</div>'+
      '<button class="copybtn ghost" onclick="copyText('+JSON.stringify(p.url||FALLBACK_URL)+',\'リンクをコピーしました\')">リンクをコピー</button>'+
    '</div>'+

    '<div class="copybox">'+
      '<div class="k">送る文面</div>'+
      '<textarea id="msg">'+esc(msg)+'</textarea>'+
      '<button class="copybtn" onclick="copyText(document.getElementById(\'msg\').value,\'文面をコピーしました\')">この文面をコピー</button>'+
    '</div>'+
  '</div>';
}

/* --------------------------------------------------------- 読み込み */
function renderAll(){
  if(selected && !findPerson(selected)) selected=null;
  renderHero();
  renderTotals();
  renderNames();
  renderMine();
}

/* シートは他の出演者も同時に触るので、開きっぱなしだと古くなる。
   自動ポーリングはせず（回線と実行回数を食うため）、明示的な更新ボタンで引き直す。 */
function load(isReload){
  var btn=document.getElementById('reload');
  if(isReload){ btn.disabled=true; btn.classList.add('busy'); }
  return fetch(ENDPOINT+'&t='+Date.now())   // GAS/ブラウザのキャッシュを避ける
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok) throw new Error(d && d.error ? d.error : 'データを取得できませんでした');
      data=d;
      renderAll();
      if(isReload) toast('最新にしました');
    })
    .catch(function(e){
      if(isReload){ toast('更新できませんでした。もう一度試してください'); }
      else document.getElementById('content').innerHTML=
        '<div class="err">読み込みに失敗しました：'+esc(e.message||e)+'</div>';
    })
    .then(function(){ btn.disabled=false; btn.classList.remove('busy'); });
}
function reload(){ load(true); }

load(false);
</script>
</body>
