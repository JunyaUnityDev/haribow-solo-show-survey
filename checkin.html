<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>当日受付｜HARIBOW単独公演</title>
<style>
  :root{ --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35; --text:#f3f1ea; --faint:#8b919e;
         --ok:#3f9d6d; --warn:#c9a24b; --ng:#b5544e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:520px;margin:0 auto;padding:14px 14px 40px}
  h1{font-size:15px;margin:0 0 10px;letter-spacing:.04em}
  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;text-align:center}
  .stat b{display:block;font-size:19px;line-height:1.3}
  .stat span{font-size:10.5px;color:var(--faint)}
  #cam{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:4/3;object-fit:cover}
  .camwrap{position:relative}
  .reticle{position:absolute;inset:14% 14%;border:2px solid rgba(255,255,255,.5);border-radius:12px;pointer-events:none}
  .verdict{margin:12px 0;padding:16px;border-radius:12px;text-align:center;min-height:74px;
    display:flex;flex-direction:column;justify-content:center;font-size:15px;line-height:1.6}
  .verdict.idle{background:var(--panel);border:1px solid var(--line);color:var(--faint);font-size:13px}
  .verdict.ok{background:var(--ok);color:#fff}
  .verdict.warn{background:var(--warn);color:#1a1206}
  .verdict.ng{background:var(--ng);color:#fff}
  .verdict b{font-size:21px;display:block;margin-bottom:4px}
  .verdict .sub{font-size:13px;opacity:.92}
  .btn{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:14px;font-weight:700;margin-top:8px}
  .btn.main{background:#2a3f52;border-color:#39536b}
  .sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .sec h2{font-size:13px;margin:0 0 8px;color:var(--faint);font-weight:700}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);
    background:#0f1116;color:var(--text);font-size:16px}
  .hit{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;margin-top:8px;font-size:13px;line-height:1.7}
  .hit .nm{font-weight:700;font-size:15px}
  .hit .meta{color:var(--faint);font-size:12px}
  .hit button{margin-top:8px;padding:9px 14px;border-radius:8px;border:0;
    background:#2a3f52;color:#fff;font-size:13px;font-weight:700}
  .hit.done{opacity:.55}
  .note{font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>当日受付（スタッフ用）</h1>

  <div class="stats">
    <div class="stat"><b id="sEnt">–</b><span>入場</span></div>
    <div class="stat"><b id="sExp">–</b><span>予定</span></div>
    <div class="stat"><b id="sRest">–</b><span>未入場</span></div>
  </div>

  <div class="camwrap">
    <video id="cam" playsinline muted></video>
    <div class="reticle"></div>
  </div>
  <div id="verdict" class="verdict idle">カメラにQRをかざしてください</div>
  <button class="btn main" id="camBtn" onclick="startCam()">カメラを起動する</button>

  <div class="sec">
    <h2>QRが読めない・URLを失くした場合（お名前で検索）</h2>
    <input id="q" placeholder="お名前・メール・電話番号の一部" onkeydown="if(event.key==='Enter')doLookup()">
    <button class="btn" onclick="doLookup()">検索する</button>
    <div id="hits"></div>
  </div>

  <p class="note">
    ・同じQRを2回読むと「入場済み」と出ます。二重入場はここで止まります。<br>
    ・電波が不安定な時は、お名前検索での手動チェックインをお使いください。<br>
    ・このURLは外部に共有しないでください。
  </p>
</div>

<script src="vendor/jsQR.js"></script>
<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var KEY=new URLSearchParams(location.search).get('k')||'';
var video=document.getElementById('cam'), canvas=document.createElement('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
var scanning=false, lastToken='', lastAt=0;

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function post(survey, extra){
  var body=Object.assign({survey:survey, key:KEY}, extra||{});
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)}).then(function(r){return r.json();});
}

function show(cls, main, sub){
  var v=document.getElementById('verdict');
  v.className='verdict '+cls;
  v.innerHTML='<b>'+esc(main)+'</b>'+(sub?'<span class="sub">'+esc(sub)+'</span>':'');
}

function beep(ok){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var c=new C(), o=c.createOscillator(), g=c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = ok?880:220; g.gain.value=0.08;
    o.start(); setTimeout(function(){ o.stop(); c.close(); }, ok?110:260);
  }catch(e){}
}

function startCam(){
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
  .then(function(stream){
    video.srcObject=stream; video.setAttribute('playsinline',''); video.play();
    document.getElementById('camBtn').textContent='カメラ起動中（QRをかざしてください）';
    scanning=true; requestAnimationFrame(tick);
  })
  .catch(function(){
    show('ng','カメラを起動できません','ブラウザのカメラ許可をご確認ください。お名前検索をお使いください。');
  });
}

function tick(){
  if(!scanning) return;
  if(video.readyState===video.HAVE_ENOUGH_DATA){
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    var img=ctx.getImageData(0,0,canvas.width,canvas.height);
    var code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(code && code.data){
      var now=Date.now();
      // 同じQRを連続で読み続けないよう3秒はスキップ
      if(!(code.data===lastToken && now-lastAt<3000)){
        lastToken=code.data; lastAt=now;
        doCheckin(code.data);
      }
    }
  }
  requestAnimationFrame(tick);
}

function doCheckin(token){
  show('idle','照合中…','');
  post('checkin',{token:token}).then(function(r){
    var i=r.info||{};
    if(r.ok){
      beep(true);
      show('ok', i.name+' 様', i.seats+'　'+i.qty+'名　ご入場OK');
      loadStats();
    } else if(r.error==='already'){
      beep(false);
      show('warn','入場済みです', i.name+' 様　'+i.checkedAt+' に入場記録があります');
    } else if(r.error==='voided'){
      beep(false); show('ng','無効なチケットです', (i.name||'')+' 取消済みの注文です');
    } else if(r.error==='unpaid'){
      beep(false); show('ng','お支払い未確認', (i.name||'')+' 受付で確認してください');
    } else if(r.error==='bad_key'){
      show('ng','このURLでは受付できません','正しい受付用URLを開いてください');
    } else {
      beep(false); show('ng','チケットが見つかりません','お名前検索でご確認ください');
    }
  }).catch(function(){
    show('ng','通信エラー','電波をご確認ください。お名前検索も使えます');
  });
}

function doLookup(){
  var q=document.getElementById('q').value.trim();
  if(!q) return;
  var box=document.getElementById('hits'); box.innerHTML='<p class="note">検索中…</p>';
  post('checkin_lookup',{q:q}).then(function(r){
    if(!r.ok){ box.innerHTML='<p class="note">検索できませんでした</p>'; return; }
    if(!r.hits.length){ box.innerHTML='<p class="note">該当がありません。お名前の一部だけでもお試しください。</p>'; return; }
    box.innerHTML=r.hits.map(function(h){
      var done=!!h.checkedAt;
      return '<div class="hit'+(done?' done':'')+'">'
        + '<div class="nm">'+esc(h.name)+' 様</div>'
        + '<div class="meta">'+esc(h.seats)+'　'+esc(h.qty)+'名　'+esc(h.status)
        + (done?('　／ '+esc(h.checkedAt)+' 入場済み'):'')+'</div>'
        + (done || h.status!=='済' || !h.token ? ''
            : '<button onclick="doCheckin(\''+esc(h.token)+'\')">入場を記録する</button>')
        + '</div>';
    }).join('');
  });
}

function loadStats(){
  post('checkin_stats',{}).then(function(r){
    if(!r.ok) return;
    document.getElementById('sEnt').textContent=r.entered;
    document.getElementById('sExp').textContent=r.expected;
    document.getElementById('sRest').textContent=Math.max(0,r.expected-r.entered);
  }).catch(function(){});
}

if(!KEY){ show('ng','合言葉がありません','運営メニュー⑦で表示されるURLを開いてください'); }
else { loadStats(); setInterval(loadStats, 60000); }
</script>
</body>
</html>
