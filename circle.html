<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HARIBOW単独公演 サークル代表ヒアリング</title>
<style>
:root{--bg:#f5f8fd;--panel:#ffffff;--line:#d3deec;--ink:#142a52;--dim:#5b6b86;--faint:#93a1b8;--blue:#2563eb;--ok:#1a9b66;--warn:#d1502f;--shadow:0 6px 20px rgba(20,42,82,.10)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,rgba(37,99,235,.08),transparent 60%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-feature-settings:"palt";-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 80px}
.logo{height:54px;width:auto;display:block;margin:4px 0 12px}
h1{font-size:20px;font-weight:800;margin:0 0 6px}
h1 b{color:var(--blue)}
.lead{color:var(--dim);font-size:13.5px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
label{display:block;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:6px}
select,input{width:100%;background:#eef3fa;border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;margin-bottom:14px}
select:last-child,input:last-child{margin-bottom:0}
.chk-group{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.chk-row{display:flex;align-items:center;gap:8px;font-size:14.5px}
.chk-row input{width:auto;margin:0}
.hint{font-size:12px;color:var(--faint);margin:-10px 0 14px}
.btn{width:100%;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,.28);letter-spacing:.03em}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.muted{color:var(--faint);font-size:12.5px}
.err{color:var(--warn);font-size:13px;margin-top:8px;display:none}
.done{text-align:center;padding:40px 20px}
.done .ck{font-size:40px;color:var(--ok);font-weight:800}
.done h2{font-size:20px;margin:12px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://junyaunitydev.github.io/haribow-audition-second-site/assets/haribow-logo.png" alt="HARIBOW">
  <h1>単独公演 サークル代表ヒアリング</h1>
  <p class="lead">2026年9月29日、めぐろパーシモンホールでHARIBOW初の単独公演を行います。サークルの代表の方から、部員のみなさんの参加見込みをまとめて教えてください。何度でも送り直せます（後から送ると前の回答が上書きされます）。</p>

  <div id="form">
    <div class="card">
      <label>サークル名</label>
      <select id="circleName">
        <option value="">選択してください</option>
        <option>DSP</option>
        <option>乱縄</option>
        <option>D-act</option>
        <option>purplume</option>
        <option>跳舞人</option>
        <option>ParkJack</option>
        <option>鴇縄</option>
        <option>DoubleEight</option>
        <option>shakinkey</option>
      </select>

      <label>代表者名</label>
      <input type="text" id="repName" placeholder="例：山田太郎">

      <label>連絡先（LINE等）</label>
      <input type="text" id="contact" placeholder="例：LINE ID または電話番号">

      <label>想定来場人数（概算でOK）</label>
      <input type="number" id="headcount" min="0" placeholder="例：15">

      <label>どのくらいの価格なら、多くの部員が来やすいと思いますか</label>
      <select id="priceForVolume">
        <option value="">選択してください</option>
        <option>〜1,500円</option>
        <option>1,500〜2,500円</option>
        <option>2,500〜3,500円</option>
        <option>3,500円以上</option>
      </select>

      <label>希望のスタート時間</label>
      <select id="startTime">
        <option value="">選択してください</option>
        <option>19:00</option>
        <option>19:30</option>
        <option>20:00</option>
        <option>どちらでも</option>
      </select>

      <label>どんな公演を観たいですか（複数選択可）</label>
      <div class="chk-group" id="wishGroup">
        <label class="chk-row"><input type="checkbox" value="迫力・大会レベルのリスクのある大技">迫力・大会レベルのリスクのある大技</label>
        <label class="chk-row"><input type="checkbox" value="HARIBOWやメンバーのこれまでのストーリー、今後何を目指しているのかを知れるもの">HARIBOWやメンバーのこれまでのストーリー、今後何を目指しているのかを知れるもの</label>
        <label class="chk-row"><input type="checkbox" value="出演者それぞれの個性が見えるもの">出演者それぞれの個性が見えるもの</label>
        <label class="chk-row"><input type="checkbox" value="観客参加型">観客参加型</label>
      </div>
      <input type="text" id="wishText" placeholder="自由記述（あれば）">
    </div>
    <div class="card">
      <button class="btn" id="send">送信する</button>
      <div class="err" id="err">未入力の項目があります。</div>
      <p class="muted" style="margin:10px 0 0">回答は集計のみに使います。</p>
    </div>
  </div>

  <div class="done" id="done" style="display:none">
    <div class="ck">✓</div>
    <h2>送信ありがとうございました！</h2>
    <p class="muted">回答を受け付けました。</p>
  </div>
</div>

<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';

document.getElementById('send').addEventListener('click',function(){
  var circleName=document.getElementById('circleName').value;
  var repName=document.getElementById('repName').value.trim();
  var contact=document.getElementById('contact').value.trim();
  var headcount=document.getElementById('headcount').value;
  var priceForVolume=document.getElementById('priceForVolume').value;
  var startTime=document.getElementById('startTime').value;
  var wishChecks=Array.prototype.slice.call(document.querySelectorAll('#wishGroup input:checked')).map(function(c){return c.value;});
  var wishText=document.getElementById('wishText').value.trim();
  var wish=wishChecks.join('、')+(wishText?(wishChecks.length?'／':'')+wishText:'');

  if(!circleName||!repName||!headcount||!priceForVolume||!startTime){
    document.getElementById('err').style.display='block';
    window.scrollTo(0,document.body.scrollHeight);
    return;
  }
  var btn=document.getElementById('send'); btn.disabled=true; btn.textContent='送信中…';
  fetch(ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({survey:'circle',circleName:circleName,repName:repName,contact:contact,headcount:headcount,priceForVolume:priceForVolume,startTime:startTime,wish:wish})
  }).then(function(){
    document.getElementById('form').style.display='none';
    document.getElementById('done').style.display='block';
    window.scrollTo(0,0);
  }).catch(function(e){
    btn.disabled=false; btn.textContent='送信する';
    document.getElementById('err').textContent='送信に失敗しました：'+e+' もう一度お試しください。';
    document.getElementById('err').style.display='block';
  });
});
</script>
</body>
</html>
