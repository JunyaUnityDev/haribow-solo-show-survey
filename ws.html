<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO BEYOND ｜ WSツアー 団体ボード</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
:root{
  --bg:#0a0b0e; --panel:#14161c; --panel2:#1a1d25; --line:rgba(255,255,255,.09);
  --ink:#f3f1ea; --dim:#a7adba; --faint:#6b7280;
  --teal:#63b6cc; --cream:#f0ece0; --green:#6ba583; --amber:#c08f4a; --red:#c8433a;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";-webkit-font-smoothing:antialiased;line-height:1.65}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 100px}

.top{padding:20px 0 4px}
.logomark{display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fbf9f3,#efeadc);border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);overflow:hidden}
.logomark img{height:74px;width:74px;display:block}
.eyebrow{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:16px 0 6px}
h1{font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:.02em}
.venue{color:var(--dim);font-size:12.5px;margin:0}
.updated{color:var(--faint);font-size:11px;margin:10px 0 0}

.sticky{position:sticky;top:0;z-index:30;background:rgba(10,11,14,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:14px -16px 0;padding:9px 16px;
  display:flex;align-items:center;gap:14px;font-size:12px}
.sticky .dday{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.sticky .dday small{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.08em;margin-right:5px}
.sticky .mini{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.sticky .mini b{color:var(--teal);font-size:14px}

h2{font-size:13px;font-weight:800;margin:32px 0 12px;letter-spacing:.05em;
  display:flex;align-items:center;gap:9px;color:var(--cream)}
h2::before{content:"";width:16px;height:2px;background:var(--teal);flex-shrink:0}
h2 .h2note{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:0;margin-left:auto;text-align:right}

.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:12px}
.muted{color:var(--faint);font-size:12.5px}
p{margin:0 0 10px}
p:last-child{margin-bottom:0}

/* 締切 */
.deadline{background:linear-gradient(170deg,#1a1520,#101217 60%);
  border:1px solid rgba(200,67,58,.28);border-radius:16px;padding:19px 18px;box-shadow:var(--shadow)}
.deadline .lead{font-size:12.5px;color:var(--dim);margin:0 0 4px}
.deadline .big{font-size:clamp(24px,6.5vw,34px);font-weight:800;line-height:1.15;margin:0 0 6px;
  font-variant-numeric:tabular-nums}
.deadline .big .unit{font-size:.46em;font-weight:700;color:var(--dim);margin-left:4px}
.dlgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}
.dl{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.dl .k{font-size:10px;letter-spacing:.09em;color:var(--faint);font-weight:700;text-transform:uppercase}
.dl .v{font-size:17px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.dl .v small{font-size:11.5px;font-weight:600;color:var(--dim);margin-left:3px}
.dl.warn .v{color:var(--amber)}

/* 全体の数 */
.nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.num{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:center}
.num .k{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.06em}
.num .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}

/* 講師フィルタ */
.filterbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filterbar button{font-size:12px;font-weight:700;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:100px;padding:6px 13px;cursor:pointer;font-family:inherit}
.filterbar button:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.filterbar button.on{background:var(--teal);border-color:var(--teal);color:#06222b}
.filterbar button .n{opacity:.65;font-weight:600;margin-left:4px;font-variant-numeric:tabular-nums}

/* ブロック見出し */
.block{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:.06em;
  margin:22px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.block span{color:var(--faint);font-weight:600;margin-left:8px;letter-spacing:0}

/* 団体カード */
.org{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:9px}
.org.past{opacity:.5}
.org.after{border-color:rgba(200,67,58,.32)}
.org-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.org-name{font-size:15px;font-weight:800;letter-spacing:.01em}
.org-date{font-size:12px;color:var(--teal);font-weight:700;font-variant-numeric:tabular-nums}
.org-date.none{color:var(--faint)}
.tag{font-size:10.5px;font-weight:700;border-radius:100px;padding:2px 9px;letter-spacing:.02em;white-space:nowrap}
.tag.untouched{background:rgba(200,67,58,.14);color:#eba49d;border:1px solid rgba(200,67,58,.3)}
.tag.answered{background:rgba(192,143,74,.14);color:#e0bd85;border:1px solid rgba(192,143,74,.3)}
.tag.reserved{background:rgba(99,182,204,.14);color:#a9dcea;border:1px solid rgba(99,182,204,.3)}
.tag.paid{background:rgba(107,165,131,.16);color:#a4d3b7;border:1px solid rgba(107,165,131,.32)}
.tag.after{background:rgba(200,67,58,.2);color:#f0c9c4;border:1px solid rgba(200,67,58,.4)}
.org-meta{font-size:12px;color:var(--dim);margin-top:7px;line-height:1.7}
.org-meta b{color:var(--cream);font-weight:700}
.org-meta .lbl{color:var(--faint);margin-right:5px}
.org-note{font-size:11.5px;color:var(--amber);margin-top:6px}
/* 進捗の更新パネル。カードの中に畳んで置く（見る画面と書く画面を分けない） */
.upd{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.upd-open{font-size:11.5px;font-weight:700;color:var(--teal);background:none;border:none;
  padding:0;cursor:pointer;font-family:inherit}
.upd-open:hover{text-decoration:underline}
.upd-body{margin-top:9px;display:none}
.upd-body.on{display:block}
.upd-row{margin-bottom:9px}
.upd-lbl{font-size:11px;color:var(--faint);font-weight:700;margin-bottom:5px}
.upd-opts{display:flex;flex-wrap:wrap;gap:5px}
.upd-opts button{font-size:11.5px;font-weight:700;color:var(--dim);background:var(--panel2);
  border:1px solid var(--line);border-radius:99px;padding:5px 11px;cursor:pointer;font-family:inherit}
.upd-opts button.on{background:var(--teal);border-color:var(--teal);color:#06222b}
.upd input[type=text]{width:100%;box-sizing:border-box;font-size:12.5px;color:var(--cream);
  background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-family:inherit}
.upd input[type=text]::placeholder{color:var(--faint)}
.upd-send{font-size:12px;font-weight:800;color:#06222b;background:var(--teal);border:none;
  border-radius:8px;padding:9px 18px;cursor:pointer;font-family:inherit}
.upd-send:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
  background:var(--panel2);border:1px solid var(--line);color:var(--cream);font-size:12.5px;
  font-weight:700;padding:11px 20px;border-radius:99px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.linkrow a{font-size:11.5px;font-weight:700;color:var(--teal);text-decoration:none;
  border:1px solid rgba(99,182,204,.3);border-radius:100px;padding:6px 13px}
.linkrow a:hover{background:rgba(99,182,204,.1)}

.err{color:#eba49d;font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <span class="logomark"><img src="assets/go-beyond-logo.png" alt="HARIBOW単独公演 Go Beyond"></span>
    <p class="eyebrow">Solo Show 2026 — WS Tour</p>
    <h1>WSツアー 団体ボード</h1>
    <p class="venue">どの団体に、いつ会えて、いま何合目か</p>
    <p class="updated" id="updated">読み込み中…</p>
  </div>

  <div class="sticky">
    <div class="dday" id="dday"><small>団体受付終了まで</small>—</div>
    <div class="mini" id="mini"></div>
  </div>

  <div id="content">
    <h2>団体チケットの受付は8/16で閉じます</h2>
    <div id="deadline"></div>

    <h2>いまの状況</h2>
    <div class="card" id="totals"></div>

    <h2>種別でしぼる<span class="h2note" id="knote"></span></h2>
    <div class="filterbar" id="kindbar"></div>

    <h2>主担当でしぼる<span class="h2note" id="fnote"></span></h2>
    <div class="filterbar" id="filterbar"></div>

    <div id="orgs"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================================
 * 単独公演「GO BEYOND」WSツアー 団体ボード
 *
 * cast.html（出演者31名 × 自分の友人）の兄弟。こちらは行の単位が「団体」で、
 * WSで会う大学サークル・スクールから団体チケットを取るためのページ。
 * 31名全員が見てよい（2026-07-27 JUNYA）。
 *
 * 出さないものは cast.html と揃える：
 *   - 金額（赤字額・必要稼働率・予算）は出さない
 *   - 団体どうしのランキングは作らない。並び順はWSが近い順で、優劣ではない
 *
 * 読み取りは GAS の ?page=orgs。書き込みは org_update だけで、専用の鍵を使い、
 * 『WS団体_声かけ担当』の3列（打診済み/いま誰待ちか/メモ）しか触れない（ADR-007）。
 * 代表者の連絡先はレスポンス自体に含めていない。このページは公開URLのため。
 * ========================================================================= */

var BASE = 'https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var ENDPOINT = BASE + '?page=orgs';
/* 進捗の書き込み用。運営用(ADMIN_SECRET)とも出演者用(CAST_SECRET)とも別の鍵で、
   これで書けるのは『WS団体_声かけ担当』の3列だけ（打診済み/いま誰待ちか/メモ）。
   座席在庫・注文・予算・WBSには一切届かない。 */
var ORG_SECRET = 'hbw-2026-org-jikwrbdrkj';

var DATA = null;
/* 主担当は覚えておく。WS直後にスマホで開く人が、毎回26団体から
   自分を探し直さずに済むように（cast.html と同じ作り） */
var FILTER = null;   // 講師名。nullなら全部
try { FILTER = localStorage.getItem('hbw_ws_owner') || null; } catch(e){}
var KIND   = null;   // 種別（大学生団体/高校生団体/スクール）。nullなら全部

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function n(v){ return Number(v) || 0; }

/* 本番までの残り日数（9/29） */
function daysToShow(){
  var now = new Date();
  var show = new Date(2026, 8, 29);
  return Math.ceil((show - now) / 86400000);
}

function render(){
  var d = DATA;
  document.getElementById('updated').textContent =
    '最終更新 ' + d.updatedAt + '　／　本番まで ' + daysToShow() + '日';

  /* ---- 締切 ---- */
  var dl = d.deadline;
  document.getElementById('dday').innerHTML =
    '<small>団体受付終了まで</small>' + (dl.closed ? '終了' : dl.daysToClose + '日');
  /* 上部は「未接触が何件あるか」より「いま自分が動く番の団体が何件あるか」を先に出す。
     絞り込み中は絞った範囲の件数を出す（自分の担当だけ見ている時に全体の件数が出ると紛らわしい） */
  var scope = d.orgs.filter(function(o){
    return (!KIND || (o.kind || '未分類') === KIND) && (!FILTER || o.owner === FILTER);
  });
  var myTurn = scope.filter(function(o){ return o.waiting === 'こちらの番'; }).length;
  var untouched = scope.filter(function(o){ return o.state === '未接触'; }).length;
  document.getElementById('mini').innerHTML =
    (myTurn ? 'こちらの番 <b>' + myTurn + '</b>件　' : '') +
    '未接触 <b>' + untouched + '</b> / ' + scope.length + '団体';

  document.getElementById('deadline').innerHTML =
    '<div class="deadline">' +
      '<p class="lead">8/16を過ぎると団体での申し込みができなくなります（席は個人向けに開放されます）</p>' +
      '<p class="big">' + (dl.closed ? '受付終了' : 'あと' + dl.daysToClose + '<span class="unit">日</span>') + '</p>' +
      '<div class="dlgrid">' +
        '<div class="dl"><div class="k">受付終了</div><div class="v">' + esc(dl.close) + '</div></div>' +
        '<div class="dl warn"><div class="k">入金まで見た推奨ライン</div><div class="v">' + esc(dl.recommend) +
          '<small>あと' + dl.daysToRecommend + '日</small></div></div>' +
      '</div>' +
      /* 2026-07-29 団体に銀行振込を足した時点で、リマインドと自動キャンセルの仕様が変わった。
         旧：リマインドは8/10・8/14・8/16の固定日／8/16までに未入金なら8/17朝に自動キャンセル
         新：リマインドは予約ごとの支払期限の4日前／振込は自動キャンセルしない（運営が銀行を見て判断）
         正典は decisions/ADR-008。ここを直し忘れると、団体に事実と違う案内をすることになる。 */
      '<p class="muted" style="margin-top:13px">' +
        'お支払い期限は予約ごとに違います（<b>カード決済は申込から1週間・銀行振込は2週間</b>／8/31が上限）。' +
        '入金のリマインドは、その期限の4日前に自動で飛びます。<br>' +
        '<b>銀行振込の未入金は自動キャンセルしません。</b>期限を過ぎたら運営に通知が来るので、' +
        '銀行の入出金を確認したうえで解放するか判断します。カード決済のみ期限超過で自動キャンセルされます。' +
      '</p>' +
    '</div>';

  /* ---- 全体 ---- */
  var t = d.totals;
  document.getElementById('totals').innerHTML =
    '<div class="nums">' +
      '<div class="num"><div class="k">団体</div><div class="v">' + t.orgs + '</div></div>' +
      '<div class="num"><div class="k">想定来場</div><div class="v">' + t.expected + '<span style="font-size:12px">人</span></div></div>' +
      '<div class="num"><div class="k">予約済</div><div class="v">' + t.booked + '</div></div>' +
    '</div>' +
    '<div class="nums" style="margin-top:9px">' +
      '<div class="num"><div class="k">配信 視聴希望</div><div class="v">' + n(t.streamPeople) + '<span style="font-size:12px">人</span></div></div>' +
      '<div class="num"><div class="k">配信 購入単位</div><div class="v">' + n(t.streamSeats) + '<span style="font-size:12px">枚</span></div></div>' +
      '<div class="num"><div class="k">打診済み</div><div class="v">' + n(t.contacted) + '<span style="font-size:12px">/' + t.orgs + '</span></div></div>' +
    '</div>' +
    '<p class="muted" style="margin-top:12px">' +
      '想定' + t.expected + '人は代表者ヒアリングの自己申告値です。' +
      '団体券は大学サークルが1人' + n(d.prices.circle).toLocaleString('ja-JP') + '円、' +
      'それ以外の団体が1人' + n(d.prices.other).toLocaleString('ja-JP') + '円で、5名から申し込めます。席は後方サイドです。' +
    '</p>' +
    '<div class="linkrow">' +
      '<a href="' + esc(d.reserveUrl) + '" target="_blank" rel="noopener">団体申し込みページ</a>' +
      '<a href="cast.html">出演者ページ</a>' +
    '</div>';

  /* ---- 主担当フィルタ ----
     講師は1つのWSに4〜5人行くので、全員で絞ると「誰が代表に話すのか」が消える。
     1団体につき1人の主担当（WS団体_声かけ担当タブ）で絞る。 */
  /* ---- 種別タブ（大学生団体／高校生団体／スクール）----
     シートのM列がそのまま出る。種別を変えたら主担当の絞りは解除する（空表示を避ける） */
  var kOrder = ['大学生団体', '高校生団体', 'スクール'];
  var kCounts = {};
  d.orgs.forEach(function(o){
    var k = o.kind || '未分類';
    kCounts[k] = (kCounts[k] || 0) + 1;
  });
  var kNames = Object.keys(kCounts).sort(function(a, b){
    var ai = kOrder.indexOf(a), bi = kOrder.indexOf(b);
    if(ai < 0) ai = 99; if(bi < 0) bi = 99;
    if(ai !== bi) return ai - bi;
    return a < b ? -1 : 1;
  });
  var kn = document.getElementById('knote');
  if(kn) kn.textContent = '分け方はシートのM列で';
  var kb = document.getElementById('kindbar');
  kb.innerHTML =
    '<button data-k="" class="' + (KIND ? '' : 'on') + '">全部<span class="n">' + d.orgs.length + '</span></button>' +
    kNames.map(function(nm){
      return '<button data-k="' + esc(nm) + '" class="' + (KIND === nm ? 'on' : '') + '">' +
             esc(nm) + '<span class="n">' + kCounts[nm] + '</span></button>';
    }).join('');
  Array.prototype.forEach.call(kb.querySelectorAll('button'), function(b){
    b.onclick = function(){
      KIND = b.getAttribute('data-k') || null;
      FILTER = null;
      try { localStorage.removeItem('hbw_ws_owner'); }catch(e){}
      render();
    };
  });

  var inKind = d.orgs.filter(function(o){ return !KIND || (o.kind || '未分類') === KIND; });

  var counts = {};
  inKind.forEach(function(o){
    if(o.owner) counts[o.owner] = (counts[o.owner] || 0) + 1;
  });
  var names = Object.keys(counts).sort(function(a, b){ return counts[b] - counts[a]; });
  var fn = document.getElementById('fnote');
  if(fn) fn.textContent = '1団体につき1人。入れ替えはシートのD列で';
  var fb = document.getElementById('filterbar');
  fb.innerHTML =
    '<button data-i="" class="' + (FILTER ? '' : 'on') + '">全部<span class="n">' + inKind.length + '</span></button>' +
    names.map(function(nm){
      return '<button data-i="' + esc(nm) + '" class="' + (FILTER === nm ? 'on' : '') + '">' +
             esc(nm) + '<span class="n">' + counts[nm] + '</span></button>';
    }).join('');
  Array.prototype.forEach.call(fb.querySelectorAll('button'), function(b){
    b.onclick = function(){
      FILTER = b.getAttribute('data-i') || null;
      try { FILTER ? localStorage.setItem('hbw_ws_owner', FILTER) : localStorage.removeItem('hbw_ws_owner'); }catch(e){}
      render();
    };
  });

  /* ---- 団体一覧（WSが近い順・ブロックで区切る） ---- */
  var list = inKind.filter(function(o){
    return !FILTER || o.owner === FILTER;
  });

  /* 「こちらの番」＝相手からボールが返ってきていて、次に動くのがこちらの団体。
     WSの日程やチャネルより先に見せる。ここが今日やることになる（ADR-007）。 */
  list.sort(function(a, b){
    var aw = (a.waiting === 'こちらの番') ? 0 : 1;
    var bw = (b.waiting === 'こちらの番') ? 0 : 1;
    return aw - bw;
  });

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var html = '', lastBlock = '';
  list.forEach(function(o){
    var ws = o.ws;
    var past = ws && new Date(ws.date.replace(/\//g, '-')) < today;
    var block;
    if(o.waiting === 'こちらの番')      block = '今日やること';
    else if(o.channel && o.channel !== 'WS') block = o.channel;
    else if(!ws)          block = 'WS日程が未定';
    else if(past)         block = 'WS実施ずみ';
    else if(ws.afterClose) block = 'WSが受付終了より後';
    else                  block = 'これから会える';
    if(block !== lastBlock){
      var note = block === '今日やること'     ? '相手からボールが返っています。次に動くのはこちらです'
               : block === 'これから会える'   ? '対面で話せる回が残っています'
               : block === 'WS実施ずみ'      ? 'WSは終わっているので、連絡は別経路になります'
               : block === 'WSが受付終了より後' ? 'WSの時点で団体申し込みは閉じています'
               : block === 'WS日程が未定'    ? '日程が決まっていません'
               : block === 'スクール'        ? 'WSツアーの対象外。主担当から直接連絡する相手です'
               : '';
      html += '<div class="block">' + esc(block) + '<span>' + esc(note) + '</span></div>';
      lastBlock = block;
    }

    var tagCls = o.state === '入金済' ? 'paid'
               : o.state === '予約済・未入金' ? 'reserved'
               : o.state === '回答あり・未予約' ? 'answered' : 'untouched';

    var meta = '';
    if(ws){
      meta += '<div><span class="lbl">WS</span><b>' + esc(ws.dateLabel) + ' ' + esc(ws.slot) + '</b>' +
              (ws.time ? '　' + esc(ws.time) : '') + (ws.place ? '　' + esc(ws.place) : '') + '</div>';
    }
    if(o.owner){
      meta += '<div><span class="lbl">主担当</span><b>' + esc(o.owner) + '</b>' +
              (o.instructors && o.instructors.length
                ? '　<span style="color:var(--faint)">同行 ' +
                  esc(o.instructors.filter(function(i){ return i !== o.owner; }).join('、')) + '</span>'
                : '') + '</div>';
    }else if((o.instructors || []).length){
      meta += '<div><span class="lbl">講師</span>' + esc(o.instructors.join('、')) + '</div>';
    }
    if(o.streamSeats){
      meta += '<div><span class="lbl">配信</span>視聴希望 <b>' + n(o.streamPeople) + '人</b>' +
              '（購入単位 ' + n(o.streamSeats) + '枚）</div>';
    }
    if(o.talk){
      meta += '<div><span class="lbl">話すこと</span>' + esc(o.talk) + '</div>';
    }
    if(o.waiting){
      meta += '<div><span class="lbl">いま</span><b>' + esc(o.waiting) + '</b></div>';
    }
    if(o.ownerMemo){
      meta += '<div><span class="lbl">メモ</span>' + esc(o.ownerMemo) + '</div>';
    }
    if(o.survey.answered){
      // 連絡先はこのページに出さない。預かった個人情報なので、必要ならシートのN列を見る（ADR-007）
      meta += '<div><span class="lbl">代表</span>' + esc(o.survey.rep) + '</div>';
      meta += '<div><span class="lbl">想定</span><b>' + n(o.survey.expected) + '人</b>' +
              (o.survey.price ? '　払える価格帯 ' + esc(o.survey.price) : '') + '</div>';
    }else{
      meta += '<div><span class="lbl">代表ヒアリング</span>まだ回答がありません</div>';
    }
    if(o.booking.has){
      meta += '<div><span class="lbl">予約</span><b>' + esc(o.booking.status) + '</b>　' +
              n(o.booking.count) + '人　' + n(o.booking.amount).toLocaleString('ja-JP') + '円</div>';
    }

    html +=
      '<div class="org' + (past ? ' past' : '') + (ws && ws.afterClose ? ' after' : '') + '">' +
        '<div class="org-h">' +
          '<span class="org-name">' + esc(o.name) + '</span>' +
          '<span class="org-date' + (ws ? '' : ' none') + '">' + (ws ? esc(ws.dateLabel) : '日程未定') + '</span>' +
          '<span class="tag ' + tagCls + '">' + esc(o.state) + '</span>' +
          (ws && ws.afterClose ? '<span class="tag after">受付終了後</span>' : '') +
          (o.contacted ? '<span class="tag paid">打診済み</span>' : '') +
        '</div>' +
        '<div class="org-meta">' + meta + '</div>' +
        (o.note ? '<div class="org-note">' + esc(o.note) + '</div>' : '') +
        updPanel(o) +
      '</div>';
  });

  document.getElementById('orgs').innerHTML = html || '<p class="muted">該当する団体がありません。</p>';
  bindUpd();
}

/* ---- 進捗の更新 ----
   聞くのは「声をかけたか」「いま誰待ちか」「次に何をするか」の3つだけ。
   人数や金額は聞かない。手数が増えると埋まらない（ADR-007）。 */
var WAITING_OPTS = ['返事待ち', 'こちらの番', '日程調整中', '今回は見送り'];

function updPanel(o){
  var id = 'u' + Math.abs(hashStr(o.name));
  var cur = o.waiting || '';
  return '<div class="upd">' +
    '<button class="upd-open" data-t="' + id + '">＋ 進捗を入れる</button>' +
    '<div class="upd-body" id="' + id + '" data-org="' + esc(o.name) + '">' +
      '<div class="upd-row"><div class="upd-lbl">代表に声をかけましたか</div>' +
        '<div class="upd-opts" data-f="contacted">' +
          '<button data-v="true" class="' + (o.contacted ? 'on' : '') + '">かけた</button>' +
          '<button data-v="false" class="' + (o.contacted ? '' : 'on') + '">まだ</button>' +
        '</div></div>' +
      '<div class="upd-row"><div class="upd-lbl">いま誰待ちですか</div>' +
        '<div class="upd-opts" data-f="waiting">' +
          WAITING_OPTS.map(function(w){
            return '<button data-v="' + esc(w) + '" class="' + (cur === w ? 'on' : '') + '">' + esc(w) + '</button>';
          }).join('') +
        '</div></div>' +
      '<div class="upd-row"><div class="upd-lbl">次にいつ何をしますか（任意）</div>' +
        '<input type="text" data-f="memo" placeholder="8/5に代表へ再連絡" maxlength="120"></div>' +
      '<button class="upd-send">送信する</button>' +
    '</div></div>';
}

function hashStr(s){
  var h = 0;
  for(var i=0; i<s.length; i++){ h = ((h << 5) - h) + s.charCodeAt(i); h |= 0; }
  return h;
}

function bindUpd(){
  Array.prototype.forEach.call(document.querySelectorAll('.upd-open'), function(b){
    b.onclick = function(){
      var body = document.getElementById(b.getAttribute('data-t'));
      var on = body.classList.toggle('on');
      b.textContent = on ? '− 閉じる' : '＋ 進捗を入れる';
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.upd-opts'), function(g){
    Array.prototype.forEach.call(g.querySelectorAll('button'), function(b){
      b.onclick = function(){
        Array.prototype.forEach.call(g.querySelectorAll('button'), function(x){ x.classList.remove('on'); });
        b.classList.add('on');
      };
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.upd-send'), function(b){
    b.onclick = function(){ sendUpd(b); };
  });
}

function sendUpd(btn){
  var body = btn.parentNode;
  var org  = body.getAttribute('data-org');
  var fields = {};
  Array.prototype.forEach.call(body.querySelectorAll('.upd-opts'), function(g){
    var on = g.querySelector('button.on');
    if(on) fields[g.getAttribute('data-f')] = on.getAttribute('data-v');
  });
  var memo = body.querySelector('input[data-f=memo]');
  if(memo && memo.value.trim()) fields.memo = memo.value.trim();
  if(fields.contacted !== undefined) fields.contacted = (fields.contacted === 'true');

  btn.disabled = true; btn.textContent = '送信中…';
  fetch(BASE, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ survey:'org_update', secret:ORG_SECRET, org:org, fields:fields }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res || !res.ok) throw new Error(res && res.error ? res.error : 'unknown');
      if(memo) memo.value = '';
      toast(org + ' を更新しました');
      /* 書いた直後に取り直すと、GAS側の書き込みが読み取りに間に合わずに
         古い値で描き直してしまう（実測）。送った内容は手元にあるので、
         再取得せずにこの場のデータを更新して描き直す。 */
      if(DATA && DATA.orgs){
        for(var i=0; i<DATA.orgs.length; i++){
          if(DATA.orgs[i].name !== org) continue;
          if(fields.contacted !== undefined) DATA.orgs[i].contacted = fields.contacted;
          if(fields.waiting)                 DATA.orgs[i].waiting   = fields.waiting;
          break;
        }
        render();
      }
    })
    .catch(function(e){ toast('更新できませんでした（' + e.message + '）'); })
    .then(function(){ btn.disabled = false; btn.textContent = '送信する'; });
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}

function load(){
 return fetch(ENDPOINT)
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d || !d.ok){ throw new Error(d && d.error ? d.error : 'unknown'); }
    DATA = d;
    render();
  })
  .catch(function(e){
    document.getElementById('updated').textContent = '';
    document.getElementById('content').innerHTML =
      '<div class="card"><p class="err">データを読み込めませんでした（' + esc(e.message) + '）</p>' +
      '<p class="muted">時間をおいて再読み込みしてください。</p></div>';
  });
}

load();
</script>
