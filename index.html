<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>チケット｜HARIBOW単独公演「Go Beyond」</title>
<meta name="description" content="HARIBOW単独公演「Go Beyond」2026年9月29日(火) めぐろパーシモンホール 大ホール。チケットのご購入はこちらから。">
<!--
  2026-08-29：このページを差し替えた。
  ★それまで ticket.haribow.com のルートは7月の「興味関心アンケート」のままだった。
    チケット販売が始まって以降、ドメインだけ打った人が「行ってみたいと思いますか」に着地していた
    （全体監査で軽微として2回連続で報告されていたもの）。
  ★旧アンケートは interest_archive.html に丸ごと残してある。solo_interest.html も別途生きている。
  ★ここに締切の日付を書かないこと。日付の正典は gas/Deadlines.js で、
    このリポに日付を書くと gas_tests/check_deadlines.js の検出対象になる。
    公演日だけは締切ではないので書いている。
-->
<style>
  :root{ --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35; --text:#f3f1ea; --faint:#8b919e;
         --accent:#2a3f52; --accentline:#39536b; --teal:#7fb8b0; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-text-size-adjust:100%;font-feature-settings:"palt"}
  .wrap{max-width:520px;margin:0 auto;padding:56px 20px 64px}
  .logo{display:block;width:132px;margin:0 auto 30px;opacity:.95}
  h1{font-size:15px;letter-spacing:.16em;text-align:center;font-weight:700;margin:0 0 6px}
  .sub{font-size:12px;color:var(--faint);text-align:center;letter-spacing:.1em;margin:0 0 30px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 20px 22px;margin-bottom:14px}
  .when{font-size:17px;font-weight:700;line-height:1.6;letter-spacing:.02em}
  .where{font-size:13px;color:var(--faint);margin-top:8px;line-height:1.8}
  .btn{display:block;width:100%;padding:15px;border-radius:10px;border:1px solid var(--accentline);
    background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-align:center;
    text-decoration:none;margin-top:18px}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--text);font-weight:600;font-size:14px;margin-top:10px}
  .links{margin-top:26px;text-align:center;font-size:13px;line-height:2.4}
  .links a{color:var(--teal);text-decoration:none;border-bottom:1px solid rgba(127,184,176,.35);padding-bottom:1px}
  .note{margin-top:30px;font-size:11.5px;color:var(--faint);line-height:1.9;
    border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/go-beyond-logo.png" alt="Go Beyond" onerror="this.style.display='none'">
  <h1>HARIBOW単独公演「Go Beyond」</h1>
  <p class="sub">TICKETS</p>

  <div class="card">
    <div class="when">2026年9月29日（火）<br>開場 18:30 ／ 開演 19:30</div>
    <div class="where">めぐろパーシモンホール 大ホール<br>東京都目黒区八雲1-1-1／東急東横線「都立大学」駅 徒歩7分</div>
    <a class="btn" href="seats.html">チケットを購入する</a>
    <!-- 2026-09-01 配信を全面中止（決定No.37・ADR-015）。「当日ご来場になれない方へ（生配信）」の
         ボタンを削除。アーカイブも無いため、来場できない方への代替導線は存在しない。
         代わりの文言を置かない。 -->
    <a class="btn ghost" href="seats.html?tab=group">5名以上でお申し込みの方（団体）</a>
  </div>

  <div class="links">
    <a href="https://go-beyond.haribow.com">公式サイト（演目・来場ガイド）</a><br>
    <a href="ticket.html">ご購入済みの方（電子チケット）</a><br>
    <a href="contact.html">お問い合わせ</a><br>
    <a href="tokushoho.html">特定商取引法に基づく表記</a>
  </div>

  <p class="note">
    ご不明な点は <a href="mailto:info@haribow.com" style="color:var(--teal)">info@haribow.com</a> までお気軽にお問い合わせください。<br>
    車椅子でのご来場をご希望の方は、購入画面からはお申し込みいただけません。上記メールアドレスまでご連絡ください。
  </p>
</div>
</body>
</html>
