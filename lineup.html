<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO BEYOND ｜ 構成台本エディタ</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<style>
:root{
  --bg:#0a0b0e; --panel:#14161c; --panel2:#1a1d25; --line:rgba(255,255,255,.09);
  --ink:#f3f1ea; --dim:#a7adba; --faint:#6b7280;
  --teal:#63b6cc; --cream:#f0ece0;
  --red:#c8433a; --amber:#c08f4a; --green:#6ba583; --violet:#8f7fb0;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  font-feature-settings:"palt";-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px}
a{color:var(--teal)}

/* ---------- ヘッダー ---------- */
.top{padding:18px 0 0}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--teal);font-weight:700;margin:0 0 3px}
h1{font-size:20px;font-weight:800;margin:0 0 2px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:12px;margin:0}

.sticky{position:sticky;top:0;z-index:40;background:rgba(10,11,14,.88);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);margin:14px -16px 0;padding:9px 16px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--cream);font-size:14px;font-weight:800}
.chip.ok b{color:var(--green)} .chip.over b{color:var(--red)} .chip.warn b{color:var(--amber)}
.spacer{margin-left:auto}
button{font-family:inherit;font-size:12px;font-weight:700;border-radius:9px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:7px 13px}
button:hover{border-color:rgba(255,255,255,.24)}
button.primary{background:var(--teal);border-color:var(--teal);color:#0a1418}
button.primary:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--dim)}
button.mini{padding:3px 8px;font-size:11px;font-weight:600}

h2{font-size:12px;font-weight:800;margin:28px 0 11px;letter-spacing:.05em;
  display:flex;align-items:center;gap:9px;color:var(--cream)}
h2::before{content:"";width:16px;height:2px;background:var(--teal);flex-shrink:0}
h2 .note{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:0;margin-left:auto}

.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:11px}
.muted{color:var(--faint);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:940px){ .grid2{grid-template-columns:1.25fr .95fr;gap:22px;align-items:start} }

/* ---------- 設定 ---------- */
.settings{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:10.5px;color:var(--faint);letter-spacing:.04em}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
input[type=number]{font-variant-numeric:tabular-nums}
.w60{width:64px} .w80{width:86px} .w110{width:112px}

/* ---------- ブロックカード ---------- */
#list{display:flex;flex-direction:column;gap:8px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;transition:border-color .12s}
.blk.dragging{opacity:.35;border-color:var(--teal)}
.blk.k-kyukei{background:linear-gradient(90deg,rgba(143,127,176,.14),transparent)}
.blk.k-sub{background:linear-gradient(90deg,rgba(99,182,204,.08),transparent)}
.blk.unplaced{border-color:var(--amber)}
.handle{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:2px;cursor:grab;user-select:none}
.handle:active{cursor:grabbing}
.grip{width:16px;height:16px;opacity:.55}
.ord{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:700}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows button{padding:0;width:18px;height:15px;line-height:1;font-size:9px;border-radius:4px;color:var(--faint)}
.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tstart{font-variant-numeric:tabular-nums;font-size:12.5px;font-weight:800;color:var(--teal);
  min-width:44px;letter-spacing:.02em}
.nm{flex:1;min-width:150px;font-weight:700;font-size:13.5px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:7px}
.act{font-size:10px;letter-spacing:.08em;color:var(--faint);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;white-space:nowrap}
.note{flex:1;min-width:180px}
.cast{margin-top:8px;display:flex;gap:4px;flex-wrap:wrap}
.mchip{font-size:10.5px;background:var(--panel2);border:1px solid var(--line);
  border-radius:999px;padding:1px 8px;color:var(--dim)}
.mchip.hot{border-color:var(--red);color:#e8a29b}
.castnote{font-size:10.5px;color:var(--faint);margin-top:6px}

/* ---------- 検出 ---------- */
.warn{border-left:3px solid var(--amber);padding:9px 12px;background:var(--panel2);
  border-radius:0 9px 9px 0;margin-bottom:8px;font-size:12.5px}
.warn.bad{border-left-color:var(--red)}
.warn.info{border-left-color:var(--teal)}
.warn b{color:var(--cream)}
.warn .who{color:var(--dim);font-size:11.5px}

/* ---------- メンバー稼働グリッド ---------- */
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.mg{border-collapse:collapse;font-size:11px;white-space:nowrap}
table.mg th,table.mg td{padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.05)}
table.mg th.v{writing-mode:vertical-rl;text-orientation:mixed;font-weight:600;color:var(--dim);
  height:104px;vertical-align:bottom;padding-bottom:5px;font-size:10px}
table.mg td.n{position:sticky;left:0;background:var(--panel);color:var(--ink);padding-right:10px;font-size:11.5px}
table.mg td.c{text-align:center;width:22px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.10)}
.dot.on{background:var(--teal)}
.dot.on.run{background:var(--red)}
tr.zero td.n{color:var(--amber)}

.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:12.5px;z-index:80;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(10,11,14,.92);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px;
  display:flex;gap:12px;align-items:center;justify-content:center}
.savebar .st{font-size:11.5px;color:var(--faint)}
</style>
</head>
<body>
<div class="wrap">

<div class="top">
  <p class="eyebrow">GO BEYOND / 2026.09.29</p>
  <h1>構成台本エディタ</h1>
  <p class="sub">演目の並び・尺・幕を決める。順番はドラッグで動く。<span class="muted">出演メンバーは『演目順・稼働』タブが正典（ここでは読むだけ）</span></p>
</div>

<div class="sticky">
  <span class="chip">開演 <b id="cOpen">--:--</b></span>
  <span class="chip" id="cEndWrap">終演 <b id="cEnd">--:--</b></span>
  <span class="chip">1幕 <b id="cAct1">-</b>分</span>
  <span class="chip">2幕 <b id="cAct2">-</b>分</span>
  <span class="chip" id="cWarnWrap">連続 <b id="cWarn">-</b>件</span>
  <span class="spacer"></span>
  <button class="ghost" onclick="load()">再読込</button>
  <button class="ghost" onclick="copyScript()">テキストで写す</button>
</div>

<h2>設定 <span class="note">すべて仮置き可。ここを変えると下の時刻が全部動く</span></h2>
<div class="card settings" id="settings"></div>

<div class="grid2">
  <div>
    <h2>構成 <span class="note">左のハンドルを掴んで上下に動かす</span></h2>
    <div id="list"></div>
    <div style="margin-top:10px;display:flex;gap:7px;flex-wrap:wrap">
      <button class="mini" onclick="addBlock('MC')">＋ MC・喋り</button>
      <button class="mini" onclick="addBlock('客席参加')">＋ 客席参加</button>
      <button class="mini" onclick="addBlock('映像')">＋ 映像</button>
      <button class="mini" onclick="addBlock('休憩')">＋ 休憩</button>
      <button class="mini" onclick="addBlock('その他')">＋ その他</button>
    </div>
  </div>

  <div>
    <h2>検出 <span class="note">並べ替えるたびに再計算</span></h2>
    <div id="warns"></div>

    <h2>誰がどこに出るか <span class="note">赤＝連続</span></h2>
    <div class="card gridwrap" id="mgrid"></div>
  </div>
</div>

</div>

<div class="savebar">
  <span class="st" id="savest">読み込み中</span>
  <button class="primary" id="saveBtn" onclick="save()" disabled>スプレッドシートに保存</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   構成台本エディタ

   読み : GAS ?page=lineup        『演目順・稼働』（誰が出るか）＋『構成台本』（順番・尺）
   書き : GAS survey=lineup_save  『構成台本』タブだけ。稼働マトリクスには絶対に書かない
   幕   : 入力させない。休憩ブロックより前＝1幕／後＝2幕として計算で出す
          （手入力にすると、休憩を動かした瞬間に幕の表記だけが嘘になる）
   連続 : 同じ人の「出番の終わり→次の出番の頭」を分で出し、しきい値未満を警告する

   鍵は dashboard.html と同じ DASH_SECRET。席・金・お客様のメールには届かない。
   ============================================================ */
var BASE = 'https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var DASH_SECRET = 'hbw-2026-board-w3x8fq5r';

var S = { blocks:[], cast:{}, members:[], engiNames:[], settings:{}, orphan:[], dirty:false };
var uid = 0;

/* ---------- 時刻 ---------- */
function parseHHMM(s){ var m = String(s == null ? '' : s).match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1]) * 60 + (+m[2]) : null; }
function fmtHHMM(t){ t = Math.round(t); var h = Math.floor(t / 60) % 24, m = ((t % 60) + 60) % 60;
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m; }
function n(x){ var v = Number(x); return isFinite(v) ? v : 0; }
function setting(k, d){ var v = S.settings[k]; return (v === '' || v == null) ? d : v; }
function round1(x){ return Math.round(x * 10) / 10; }

/* ---------- 計算 ----------
   時刻・幕・連続を1本の関数で出す。別々に数えると必ず食い違う。 */
function compute(){
  var open = parseHHMM(setting('開演時刻', '19:30'));
  if(open == null) open = 19 * 60 + 30;

  var t = open, act = 1;
  S.blocks.forEach(function(b, i){
    b._i = i;
    b._start = t;
    b._act = (b.kind === '休憩') ? 0 : act;   // 0 ＝ 幕間
    b._end = t + n(b.dur);                    // 転換は出番の外
    t += n(b.dur) + n(b.trans);
    if(b.kind === '休憩') act = 2;
  });

  var res = { open:open, end:t, act1:0, act2:0, runs:[], pending:[], zero:[], counts:{}, own:{}, hot:{} };

  /* 尺が入っていない区間は休息を計算できない。
     0分として扱うと「休息0分」の警告が全ブロックに並び、本当に詰まっている箇所が埋もれる。
     blankCum[i] ＝ 先頭からi個目までに、尺が未入力のブロックがいくつあるか。 */
  var blankCum = [0];
  S.blocks.forEach(function(b, i){
    blankCum[i + 1] = blankCum[i] + ((b.dur === '' || b.dur == null) ? 1 : 0);
  });
  S.blocks.forEach(function(b){
    var len = n(b.dur) + n(b.trans);
    if(b._act === 1) res.act1 += len; else if(b._act === 2) res.act2 += len;
  });

  var thr = n(setting('連続警告のしきい値', 5));
  var lastOf = {};
  S.blocks.forEach(function(b){
    if(b.kind !== '演目') return;
    var cast = S.cast[b.name] || [];
    /* OP＋AGT と ED は全員出演。これを出番に数えると「出番ゼロ」が誰も出なくなり、
       決定No.27で出演演目がゼロになったメンバーを見つけられない（検出の意味が消える）。
       名前で決め打ちせず「全員が入っている演目」として自動で判定する。 */
    b._allCast = S.members.length > 0 && cast.length >= S.members.length;
    cast.forEach(function(m){
      res.counts[m] = (res.counts[m] || 0) + 1;
      if(!b._allCast) res.own[m] = (res.own[m] || 0) + 1;
      var prev = lastOf[m];
      if(prev){
        // 前の出番の頭から次の出番の頭までに未入力の尺が挟まっていたら、休息は出せない
        if(blankCum[b._i] - blankCum[prev._i] > 0){
          res.pending.push({ who:m, from:prev, to:b });
        } else {
          var rest = b._start - prev._end;
          if(rest < thr){
            res.runs.push({ who:m, from:prev, to:b, rest:rest });
            res.hot[m + ' ' + prev.uid] = 1;
            res.hot[m + ' ' + b.uid] = 1;
          }
        }
      }
      lastOf[m] = b;
    });
  });
  S.members.forEach(function(m){ if(!res.own[m.name]) res.zero.push(m.name); });
  return res;
}

/* ---------- 描画 ---------- */
function render(){
  var r = compute();

  document.getElementById('cOpen').textContent = fmtHHMM(r.open);
  document.getElementById('cEnd').textContent  = fmtHHMM(r.end);
  document.getElementById('cAct1').textContent = Math.round(r.act1);
  document.getElementById('cAct2').textContent = Math.round(r.act2);
  document.getElementById('cWarn').textContent = r.runs.length;

  var lim = parseHHMM(setting('終演上限', '21:30'));
  var ew = document.getElementById('cEndWrap');
  ew.className = 'chip' + (lim == null ? '' : (r.end > lim ? ' over' : ' ok'));
  ew.title = lim == null ? '' :
    (r.end > lim ? Math.round(r.end - lim) + '分オーバー' : '上限まで' + Math.round(lim - r.end) + '分');
  document.getElementById('cWarnWrap').className = 'chip' + (r.runs.length ? ' warn' : ' ok');

  var list = document.getElementById('list');
  list.innerHTML = '';
  S.blocks.forEach(function(b, i){
    list.appendChild(buildCard(b, i, r));
  });

  renderWarns(r);
  renderMemberGrid(r);
}

function buildCard(b, i, r){
  var el = document.createElement('div');
  var kindClass = b.kind === '休憩' ? ' k-kyukei' : (b.kind === '演目' ? '' : ' k-sub');
  el.className = 'blk' + kindClass + (b.unplaced ? ' unplaced' : '');
  el.setAttribute('data-uid', b.uid);

  var actLabel = b._act === 0 ? '幕間' : (b._act + '幕');
  var castHtml = '';
  if(b.kind === '演目'){
    var cast = S.cast[b.name];
    var hasCol = S.engiNames.indexOf(b.name) >= 0;
    if(cast && cast.length){
      castHtml = '<div class="cast">' + cast.map(function(m){
        return '<span class="mchip' + (r.hot[m + ' ' + b.uid] ? ' hot' : '') + '">' + esc(m) + '</span>';
      }).join('') + '</div><div class="castnote">' + cast.length + '名'
        + (b._allCast ? '（全員出演。出番の数には入れていない）' : '') + '</div>';
    } else if(hasCol){
      /* 列はあるが誰にも印が付いていない。ゲスト枠なら正しく、演目なら未割当。
         どちらか分からないので断定しない。 */
      castHtml = '<div class="castnote">出演メンバーの印が『演目順・稼働』に1つも無い'
        + '（ゲスト枠ならこれで正しい）</div>';
    } else {
      castHtml = '<div class="castnote" style="color:var(--amber)">'
        + '『演目順・稼働』にこの名前の列が無い（出演者を数えられていない）</div>';
    }
  }

  el.innerHTML =
    '<div class="handle" draggable="true">'
    + '<svg class="grip" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'
    + '<circle cx="5" cy="3" r="1.4"/><circle cx="11" cy="3" r="1.4"/>'
    + '<circle cx="5" cy="8" r="1.4"/><circle cx="11" cy="8" r="1.4"/>'
    + '<circle cx="5" cy="13" r="1.4"/><circle cx="11" cy="13" r="1.4"/></svg>'
    + '<span class="ord">' + (i + 1) + '</span>'
    + '<span class="arrows">'
    + '<button class="mini" data-mv="-1" title="上へ">&#9650;</button>'
    + '<button class="mini" data-mv="1" title="下へ">&#9660;</button></span></div>'
    + '<div>'
    +   '<div class="row1">'
    +     '<span class="tstart">' + fmtHHMM(b._start) + '</span>'
    +     '<input class="nm" data-f="name" value="' + esc(b.name) + '" placeholder="ブロック名">'
    +     '<span class="act">' + actLabel + '</span>'
    +   '</div>'
    +   '<div class="row2">'
    +     kindSelect(b.kind)
    +     '<span class="muted">尺</span>'
    +     '<input class="w60" type="number" step="0.5" min="0" data-f="dur" value="' + val(b.dur) + '" placeholder="分">'
    +     '<span class="muted">転換</span>'
    +     '<input class="w60" type="number" step="0.5" min="0" data-f="trans" value="' + val(b.trans) + '" placeholder="分">'
    +     '<input class="note" data-f="note" value="' + esc(b.note || '') + '" placeholder="備考（担当・転換で動かすもの・まだ決まっていないこと）">'
    +     '<button class="mini ghost" data-del="1" title="削除">&times;</button>'
    +   '</div>'
    +   castHtml
    + '</div>';

  el.querySelectorAll('[data-f]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var f = inp.getAttribute('data-f');
      if(f === 'dur' || f === 'trans'){
        b[f] = inp.value === '' ? '' : Number(inp.value);
        markDirty(); renderSoon();
      } else {
        b[f] = inp.value;
        if(f === 'name') b.unplaced = false;
        markDirty();
      }
    });
    // 名前を確定したタイミングで出演者を引き直す
    inp.addEventListener('change', function(){
      if(inp.getAttribute('data-f') === 'name') render();
    });
  });

  el.querySelector('select').addEventListener('change', function(ev){
    b.kind = ev.target.value; markDirty(); render();
  });

  el.querySelectorAll('[data-mv]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var j = i + Number(btn.getAttribute('data-mv'));
      if(j < 0 || j >= S.blocks.length) return;
      var tmp = S.blocks[i]; S.blocks[i] = S.blocks[j]; S.blocks[j] = tmp;
      markDirty(); render();
    });
  });

  el.querySelector('[data-del]').addEventListener('click', function(){
    if(b.kind === '演目' &&
       !confirm('「' + b.name + '」は演目です。台本から外すと「本番で上演しない」という意味になります。外しますか？')) return;
    S.blocks.splice(i, 1); markDirty(); render();
  });

  var h = el.querySelector('.handle');
  h.addEventListener('dragstart', function(ev){
    el.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
    try{ ev.dataTransfer.setData('text/plain', String(b.uid)); }catch(e){}
    if(ev.dataTransfer.setDragImage) ev.dataTransfer.setDragImage(el, 24, 18);
  });
  h.addEventListener('dragend', function(){
    el.classList.remove('dragging');
    /* DOMの並びを正として配列に取り込む。
       ドラッグ中に再描画すると掴んでいる要素が作り直されて操作が切れるため、
       動かしている間はDOMだけを触り、離した時に一度だけ配列へ反映する。 */
    var order = [].slice.call(document.getElementById('list').children)
                  .map(function(c){ return c.getAttribute('data-uid'); });
    S.blocks.sort(function(a, c){
      return order.indexOf(String(a.uid)) - order.indexOf(String(c.uid));
    });
    markDirty(); render();
  });

  return el;
}

/* ドラッグ中はDOMだけを動かす */
document.addEventListener('dragover', function(ev){
  var list = document.getElementById('list');
  var dragging = list && list.querySelector('.dragging');
  if(!dragging) return;
  ev.preventDefault();
  var after = null, min = Infinity;
  [].slice.call(list.children).forEach(function(c){
    if(c === dragging) return;
    var box = c.getBoundingClientRect();
    var off = ev.clientY - box.top - box.height / 2;
    if(off < 0 && -off < min){ min = -off; after = c; }
  });
  if(after) list.insertBefore(dragging, after); else list.appendChild(dragging);
});

var soonT = null;
function renderSoon(){ clearTimeout(soonT); soonT = setTimeout(render, 300); }

function kindSelect(cur){
  return '<select class="w110">' + ['演目','MC','客席参加','休憩','映像','その他'].map(function(k){
    return '<option' + (k === cur ? ' selected' : '') + '>' + k + '</option>';
  }).join('') + '</select>';
}
function val(x){ return (x === '' || x == null) ? '' : String(x); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

/* ---------- 検出パネル ---------- */
function renderWarns(r){
  var h = '';
  var thr = n(setting('連続警告のしきい値', 5));

  if(r.runs.length){
    /* 人ごとに1行ずつ出すと、OP（全員出演）の直後だけで何行も並んで読めなくなる。
       「どの繋ぎで／何人が／何分しか空かないか」が判断の単位なので、繋ぎでまとめる。 */
    var pairs = {}, order = [];
    r.runs.forEach(function(x){
      var k = x.from.uid + '>' + x.to.uid;
      if(!pairs[k]){ pairs[k] = { from:x.from, to:x.to, rest:x.rest, who:[] }; order.push(k); }
      pairs[k].who.push(x.who);
    });
    order.map(function(k){ return pairs[k]; })
         .sort(function(a, b){ return a.rest - b.rest || b.who.length - a.who.length; })
         .forEach(function(p){
      h += '<div class="warn' + (p.rest <= 0 ? ' bad' : '') + '">'
        + '休息 <b>' + round1(p.rest) + '分</b> ／ <b>' + p.who.length + '名</b>'
        + '<div class="who">' + esc(p.from.name) + ' → ' + esc(p.to.name) + '</div>'
        + '<div class="who">' + p.who.map(esc).join('／') + '</div></div>';
    });
  } else if(!r.pending.length){
    h += '<div class="warn info">同じ人が' + thr + '分未満で続けて出る箇所は無い</div>';
  }

  if(r.pending.length){
    var pnames = {};
    r.pending.forEach(function(x){ pnames[x.from.name + ' → ' + x.to.name] = 1; });
    h += '<div class="warn info"><b>連続を判定できない繋ぎ ' + Object.keys(pnames).length + '箇所</b>'
      + '<div class="who">間にある演目の尺が未入力。休息が何分になるか出せない</div>'
      + '<div class="who">' + Object.keys(pnames).map(esc).join('／') + '</div></div>';
  }

  var lim = parseHHMM(setting('終演上限', '21:30'));
  if(lim != null && r.end > lim){
    h += '<div class="warn bad"><b>終演が上限を' + Math.round(r.end - lim) + '分オーバー</b>'
      + '<div class="who">' + fmtHHMM(r.end) + '／上限 ' + fmtHHMM(lim) + '</div></div>';
  }

  var blank = S.blocks.filter(function(b){ return b.dur === '' || b.dur == null; });
  if(blank.length){
    h += '<div class="warn"><b>尺が未入力 ' + blank.length + '件</b>'
      + '<div class="who">' + blank.map(function(b){ return esc(b.name); }).join('／') + '</div>'
      + '<div class="who">この分だけ終演時刻は実際より早く出ている</div></div>';
  }

  if(r.zero.length){
    h += '<div class="warn"><b>出番ゼロ ' + r.zero.length + '名</b>'
      + '<div class="who">' + r.zero.map(esc).join('／') + '</div>'
      + '<div class="who">全員出演の演目（OP・ED）は数えていない</div></div>';
  }

  if(S.orphan && S.orphan.length){
    h += '<div class="warn bad"><b>『演目順・稼働』に列が無いブロック</b>'
      + '<div class="who">' + S.orphan.map(esc).join('／') + '</div>'
      + '<div class="who">名前が一致していないので、出演者を数えられていない</div></div>';
  }

  var un = S.blocks.filter(function(b){ return b.unplaced; });
  if(un.length){
    h += '<div class="warn"><b>台本に無かった演目を末尾に置いた ' + un.length + '件</b>'
      + '<div class="who">' + un.map(function(b){ return esc(b.name); }).join('／') + '</div></div>';
  }

  document.getElementById('warns').innerHTML = h;
}

/* ---------- 誰がどこに出るか ---------- */
function renderMemberGrid(r){
  var engi = S.blocks.filter(function(b){ return b.kind === '演目'; });
  var rows = S.members.slice().sort(function(a, b){
    return (r.counts[b.name] || 0) - (r.counts[a.name] || 0) || a.name.localeCompare(b.name, 'ja');
  });

  var h = '<table class="mg"><thead><tr><th></th>'
    + engi.map(function(b){ return '<th class="v">' + esc(b.name) + '</th>'; }).join('')
    + '<th class="v">計</th></tr></thead><tbody>';
  rows.forEach(function(m){
    var c = r.counts[m.name] || 0;
    h += '<tr' + (c ? '' : ' class="zero"') + '><td class="n">' + esc(m.name) + '</td>';
    engi.forEach(function(b){
      var on = (S.cast[b.name] || []).indexOf(m.name) >= 0;
      h += '<td class="c"><span class="dot' + (on ? ' on' : '')
        + (on && r.hot[m.name + ' ' + b.uid] ? ' run' : '') + '"></span></td>';
    });
    h += '<td class="c" style="color:var(--faint);font-variant-numeric:tabular-nums">' + c + '</td></tr>';
  });
  h += '</tbody></table>';
  document.getElementById('mgrid').innerHTML = h;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  var el = document.getElementById('settings');
  el.innerHTML = Object.keys(S.settings).map(function(k){
    var isTime = /時刻|上限/.test(k);
    return '<div class="f"><label>' + esc(k) + '</label>'
      + '<input class="' + (isTime ? 'w80' : 'w60') + '" data-k="' + esc(k) + '" '
      + (isTime ? 'placeholder="19:30"' : 'type="number" step="0.5" min="0"')
      + ' value="' + esc(S.settings[k]) + '"></div>';
  }).join('');
  el.querySelectorAll('[data-k]').forEach(function(inp){
    inp.addEventListener('input', function(){
      S.settings[inp.getAttribute('data-k')] = inp.value;
      markDirty(); renderSoon();
    });
  });
}

/* ---------- ブロック追加 ---------- */
function addBlock(kind){
  var d = ({ 'MC':        { name:'喋る時間',     dur:5  },
             '客席参加':  { name:'客席プレイ',   dur:13 },
             '休憩':      { name:'休憩',         dur:20 },
             '映像':      { name:'つなぎ映像',   dur:1  },
             'その他':    { name:'',             dur:'' } })[kind] || { name:'', dur:'' };
  S.blocks.push({ uid:++uid, name:d.name, kind:kind, dur:d.dur, trans:'', note:'' });
  markDirty(); render();
  var list = document.getElementById('list');
  if(list.lastChild) list.lastChild.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ---------- 読み書き ---------- */
function load(){
  setStatus('読み込み中');
  fetch(BASE + '?page=lineup&k=' + encodeURIComponent(DASH_SECRET))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok){ setStatus('読み込み失敗：' + ((d && d.error) || '不明')); return; }
      S.cast = d.cast || {};
      S.members = d.members || [];
      S.settings = d.settings || {};
      S.orphan = d.orphan || [];
      S.engiNames = d.engiNames || [];
      S.blocks = (d.blocks || []).map(function(b){ b.uid = ++uid; return b; });
      S.dirty = false;
      renderSettings();
      render();
      setStatus('読み込み ' + (d.updatedAt || ''));
      document.getElementById('saveBtn').disabled = true;
      if(d.aliasMissing && d.aliasMissing.length){
        toast('『名簿マッピング』に無い呼び名 ' + d.aliasMissing.length + '件（そのまま表示している）');
      }
    })
    .catch(function(e){ setStatus('通信エラー：' + e); });
}

function save(){
  var btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('保存中');
  fetch(BASE, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({
      survey:'lineup_save', secret:DASH_SECRET, settings:S.settings,
      blocks: S.blocks.map(function(b){
        return { name:b.name, kind:b.kind, act:b._act, dur:b.dur, trans:b.trans, note:b.note };
      })
    })
  })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok){
        S.dirty = false;
        setStatus('保存済み ' + (res.updatedAt || '') + '／終演 ' + (res.endsAt || ''));
        toast('『構成台本』タブに ' + res.saved + 'ブロック保存した');
      } else {
        btn.disabled = false;
        var m = (res && res.error) || '不明';
        setStatus('保存失敗：' + m); toast('保存失敗：' + m);
      }
    })
    .catch(function(e){ btn.disabled = false; setStatus('通信エラー：' + e); });
}

/* ---------- テキストで写す ---------- */
function copyScript(){
  var r = compute();
  var lines = ['HARIBOW単独公演 構成台本（' + fmtHHMM(r.open) + '開演 → ' + fmtHHMM(r.end) + '終演）', ''];
  var lastAct = null;
  S.blocks.forEach(function(b){
    var a = b._act === 0 ? '幕間' : (b._act + '幕');
    if(a !== lastAct){ lines.push('── ' + a + ' ──'); lastAct = a; }
    lines.push(fmtHHMM(b._start) + '  ' + b.name
      + (b.dur === '' || b.dur == null ? '  [尺未定]' : '  ' + b.dur + '分')
      + (n(b.trans) ? '  ＋転換' + b.trans + '分' : '')
      + (b.note ? '  ／' + b.note : ''));
  });
  if(r.runs.length){
    lines.push('', '【連続】');
    r.runs.forEach(function(x){
      lines.push(x.who + '：' + x.from.name + ' → ' + x.to.name + '（休息 ' + round1(x.rest) + '分）');
    });
  }
  var txt = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast('コピーした'); },
      function(){ window.prompt('コピーしてください', txt); });
  } else {
    window.prompt('コピーしてください', txt);
  }
}

/* ---------- 小物 ---------- */
function markDirty(){
  S.dirty = true;
  document.getElementById('saveBtn').disabled = false;
  setStatus('未保存の変更あり');
}
function setStatus(s){ document.getElementById('savest').textContent = s; }
var toastT = null;
function toast(s){
  var el = document.getElementById('toast');
  el.textContent = s; el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove('show'); }, 3400);
}
window.addEventListener('beforeunload', function(e){
  if(S.dirty){ e.preventDefault(); e.returnValue = ''; }
});

load();
</script>
