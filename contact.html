<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お問い合わせ｜HARIBOW単独公演「Go Beyond」</title>
<style>
  :root{
    --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35;
    --text:#f3f1ea; --faint:#8b919e; --sup:#c9a24b; --ok:#6fae8a; --dead:#33373f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:480px;margin:0 auto;padding:22px 18px 64px}
  .logo{display:block;height:36px;width:auto;margin:0 auto 20px;opacity:.9}
  h1{font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:.02em}
  .lead{font-size:13px;line-height:1.9;color:var(--faint);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:16px}
  label{display:block;font-size:12px;letter-spacing:.06em;color:var(--faint);margin:0 0 7px}
  .req{color:var(--sup);margin-left:5px;font-size:11px}
  input[type=text],input[type=email],textarea,select{
    width:100%;background:#0d0f14;border:1px solid var(--line);border-radius:9px;
    color:var(--text);font-size:16px;padding:11px 12px;font-family:inherit;line-height:1.6}
  textarea{min-height:150px;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--sup)}
  .field{margin-bottom:16px}
  .field:last-child{margin-bottom:0}
  .kinds{display:grid;gap:8px}
  .kind{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;background:#0d0f14}
  .kind.on{border-color:var(--sup);background:rgba(201,162,75,.08)}
  .kind input{margin:3px 0 0;accent-color:#c9a24b;flex:none}
  .kind b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
  .kind span{display:block;font-size:11.5px;line-height:1.7;color:var(--faint)}
  .note{margin:14px 0 0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:12.5px;line-height:1.9;color:var(--faint);background:#0d0f14}
  .note b{color:var(--text)}
  .note .bar{color:var(--sup);font-weight:700}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .send{width:100%;margin-top:6px;padding:15px;border:0;border-radius:11px;background:var(--sup);
    color:#0a0b0e;font-size:16px;font-weight:800;font-family:inherit;letter-spacing:.04em;cursor:pointer}
  .send:disabled{background:var(--dead);color:var(--faint);cursor:not-allowed}
  .linked{font-size:12px;color:var(--ok);margin:0 0 16px;line-height:1.8}
  .msg{padding:44px 12px;text-align:center;line-height:2.1;color:var(--faint)}
  .msg b{display:block;color:var(--text);font-size:17px;margin-bottom:12px}
  .foot{margin-top:22px;font-size:11.5px;line-height:1.9;color:#6b7280;text-align:center}
  a{color:#8fb7c9}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/go-beyond-logo.png" alt="HARIBOW"
       onerror="this.style.display='none'">
  <div id="root">
    <h1>お問い合わせ</h1>
    <p class="lead">HARIBOW単独公演「Go Beyond」について、こちらから承ります。<br>
      3営業日以内にご連絡いたします。</p>

    <p class="linked" id="linked" style="display:none"></p>

    <form id="f" onsubmit="return false">
      <div class="card">
        <label>お問い合わせの種類<span class="req">必須</span></label>
        <div class="kinds" id="kinds">
          <label class="kind" id="k-seat">
            <input type="radio" name="kind" value="seat">
            <span><b>お席について</b>
              <span>システムの不具合で、ご希望と違うお席になってしまった場合</span></span>
          </label>
          <label class="kind" id="k-pay">
            <input type="radio" name="kind" value="payment">
            <span><b>お支払いについて</b>
              <span>決済のエラー、お振込み、ご請求に関するご確認</span></span>
          </label>
          <label class="kind" id="k-other">
            <input type="radio" name="kind" value="other">
            <span><b>その他</b>
              <span>当日のご案内、アクセス、そのほかのご質問</span></span>
          </label>
        </div>
        <div class="note" id="seatNote" style="display:none">
          <span class="bar">お席の変更について</span><br>
          システムの不具合により、ご希望と違うお席でご購入になった場合は、こちらからお知らせください。
          空き状況を確認のうえ、<b>可能な場合はお席をお移しします</b>。<br>
          ※ お客様のご都合によるお席の変更・キャンセル・払い戻しは承っておりません。<br>
          ※ お席のご相談は <b id="deadline">9月22日</b> まで承ります。
        </div>
      </div>

      <div class="card">
        <div class="field">
          <label for="name">お名前<span class="req">必須</span></label>
          <input type="text" id="name" autocomplete="name" placeholder="山田 花子">
        </div>
        <div class="field">
          <label for="contact">メールアドレス<span class="req">必須</span></label>
          <input type="email" id="contact" autocomplete="email" inputmode="email"
                 placeholder="example@haribow.com">
        </div>
        <div class="field">
          <label for="body">お問い合わせ内容<span class="req">必須</span></label>
          <textarea id="body" placeholder="できるだけ具体的にお書きください。&#10;（例）決済のときにエラーが出て、取りたかった3列20番ではなく4列21番になってしまいました。"></textarea>
        </div>
        <!-- 自動投稿よけ。人には見えない欄。
             ★ラベルに「ご住所」「電話番号」など実在の項目名を書かないこと。
               スマホの連絡先オートフィルがこの欄まで埋めてしまい、本物のお問い合わせが
               機械と誤判定される（2026-08-04に実際に指摘された）。
               サーバー側も「埋まっていたら捨てる」をやめ、シートには必ず残すようにしてある。 -->
        <label class="hp" aria-hidden="true">この欄は入力しないでください<input type="text" id="hp" name="hbw-nofill" tabindex="-1" autocomplete="off"></label>
      </div>

      <button class="send" id="send" onclick="submitForm()">送信する</button>
    </form>

    <p class="foot">
      HARIBOW単独公演「Go Beyond」 運営事務局<br>
      お急ぎの場合は <a href="mailto:info@haribow.com">info@haribow.com</a> まで
    </p>
  </div>
</div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
/* 電子チケットのURLから引き継ぐトークン。あれば、どの注文のお話かがこちら側で分かるので
   お客様は注文番号を入力しなくてよい（ticket.html のリンクが ?t= を付けて渡す）。 */
var token=new URLSearchParams(location.search).get('t')||'';
var kindSel='';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function el(id){ return document.getElementById(id); }

/* 席の相談を受け付けているかはサーバー時刻で判定する。
   端末の時計がずれていると、締め切ったはずの窓口が開いて見える。 */
fetch(BASE+'?page=contact_meta').then(function(r){return r.json();}).then(function(d){
  if(d && d.seatChangeDeadline) el('deadline').textContent = d.seatChangeDeadline;
  if(d && d.seatChangeOpen === false){
    // 期限を過ぎたら「お席について」の選択肢自体を出さない
    el('k-seat').style.display='none';
  }
}).catch(function(){ /* 取れなくてもフォームは使える。既定の表示のまま */ });

if(token){
  el('linked').style.display='';
  el('linked').textContent='電子チケットの情報を引き継いでいます。ご注文の内容はこちらで確認できますので、注文番号の入力は不要です。';
}

// 種類の選択（見た目の枠と、お席の注意書きの出し分け）
Array.prototype.forEach.call(document.querySelectorAll('.kind'), function(k){
  k.addEventListener('click', function(){
    setTimeout(function(){
      kindSel = (document.querySelector('input[name=kind]:checked')||{}).value || '';
      Array.prototype.forEach.call(document.querySelectorAll('.kind'), function(x){
        x.className = 'kind' + (x.querySelector('input').checked ? ' on' : '');
      });
      el('seatNote').style.display = (kindSel==='seat') ? '' : 'none';
      sync();
    },0);
  });
});

['name','contact','body'].forEach(function(id){ el(id).addEventListener('input', sync); });

function sync(){
  var ok = kindSel && el('name').value.trim() && el('contact').value.trim() && el('body').value.trim();
  el('send').disabled = !ok;
}
sync();

function done(title, body){
  el('root').innerHTML = '<p class="msg"><b>'+esc(title)+'</b>'+body+'</p>';
}

function submitForm(){
  var btn=el('send'); btn.disabled=true; btn.textContent='送信しています…';
  var mail=el('contact').value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){
    alert('メールアドレスの形式をご確認ください。');
    btn.disabled=false; btn.textContent='送信する'; return;
  }
  fetch(BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({survey:'contact', kind:kindSel, name:el('name').value.trim(),
      contact:mail, body:el('body').value.trim(), t:token, hp:el('hp').value})})
  .then(function(r){return r.json();}).then(function(res){
    if(res && res.ok){
      done('お問い合わせを承りました',
        '内容を確認のうえ、3営業日以内に<br>'+esc(mail)+' へご連絡いたします。<br><br>'
        +'<span style="font-size:12px">お返事が届かない場合は、迷惑メールフォルダをご確認のうえ、'
        +'<a href="mailto:info@haribow.com">info@haribow.com</a> までご連絡ください。</span>');
    } else {
      alert('送信できませんでした。お手数ですが、もう一度お試しください。\n'
          + '解決しない場合は info@haribow.com までご連絡ください。');
      btn.disabled=false; btn.textContent='送信する';
    }
  }).catch(function(){
    /* 応答が返らなくても、サーバー側では受け付けられている可能性がある。
       「もう一度」と促すと同じ問い合わせが二重に届くので、そうは書かない。 */
    done('送信結果を確認できませんでした',
      '通信が不安定なため、受け付けられたかどうかを確認できませんでした。<br><br>'
      +'お手数ですが、<a href="mailto:info@haribow.com">info@haribow.com</a> まで'
      +'直接ご連絡ください。<br>'
      +'<span style="font-size:12px">※ 同じ内容が二重に届く場合がありますが、そのままで問題ありません。</span>');
  });
}
</script>
</body>
</html>
