<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>衣装費｜HARIBOW単独公演</title>
<style>
  :root{ --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35; --text:#f3f1ea; --faint:#8b919e;
         --ok:#2e8b5f; --warn:#c9a24b; --ng:#b5544e; --accent:#2a3f52; --accentline:#39536b; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 90px}
  .bar{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .bar h1{font-size:15px;margin:0;flex:1;letter-spacing:.06em;font-weight:700}
  .who{font-size:12px;color:var(--faint)}
  .lead{font-size:12px;color:var(--faint);line-height:1.7;margin:8px 0 14px}

  .stats{display:flex;gap:6px;margin-bottom:14px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
  .stat b{display:block;font-size:18px;line-height:1.3;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--faint)}
  .stat.over b{color:#e08b84}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px}
  .card.undec{border-color:#4a3f22}
  .card.untouched{border-color:#3a2b1a}
  .nm{font-size:16px;font-weight:700;line-height:1.4}
  .meta{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.7;word-break:break-all}

  .seg{display:flex;gap:6px;margin-top:10px}
  .seg button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--line);
    background:transparent;color:var(--faint);font-size:12.5px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--accent);border-color:var(--accentline);color:#fff}
  .seg button.on.undec{background:#4a3f22;border-color:#6b5c33;color:#e8d9a8}

  .fields{margin-top:9px;display:none}
  .fields.show{display:block}
  .row2{display:flex;gap:7px}
  .fld{flex:1;margin-top:7px}
  .fld label{display:block;font-size:11px;color:var(--faint);margin-bottom:3px}
  input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:#0f1116;color:var(--text);font-size:16px;font-family:inherit}
  textarea{min-height:56px;resize:vertical}
  .btn{width:100%;padding:11px;border-radius:9px;border:1px solid var(--accentline);
    background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:9px}
  .btn:disabled{opacity:.5}
  .note{font-size:11.5px;color:var(--faint);line-height:1.8;margin-top:20px;
    border-top:1px solid var(--line);padding-top:13px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:50;
    background:#e9e6dc;color:#14161c;padding:11px 18px;border-radius:9px;font-size:13px;font-weight:700;
    box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>衣装費</h1><span class="who" id="who"></span></div>
  <p class="lead" id="lead">読み込んでいます…</p>

  <div id="body" style="display:none">
    <div class="stats">
      <div class="stat"><b id="sTotal">¥0</b><span>いま合計</span></div>
      <div class="stat" id="sRemainBox"><b id="sRemain">¥0</b><span>上限まで残り</span></div>
      <div class="stat"><b id="sUndec">0</b><span>未定・未入力</span></div>
    </div>
    <div id="list"></div>
    <button class="btn" style="background:transparent;border-color:var(--line);color:var(--faint)"
            onclick="load(true)">最新にする</button>
    <p class="note">
      何度でも書き換えられます。あとで変わっても大丈夫なので、いまの見込みで入れてください。<br>
      迷っているものは「未定」を押してください。空欄のままだと「まだ見ていない」と区別がつきません。<br>
      領収書はURL（Googleドライブや写真のリンク）を貼るだけで大丈夫です。<br>
      上限は10万円です。超えても入力はできますが、赤で出ます。
    </p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var OP=new URLSearchParams(location.search).get('op')||'';
var data=null, busy=false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yen(n){ return '¥'+(Number(n)||0).toLocaleString(); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('on'); },2600); }

function load(isReload){
  if(!OP){ document.getElementById('lead').textContent='URLが正しくありません。配布された専用URLをそのまま開いてください。'; return; }
  return fetch(BASE+'?page=costume&op='+encodeURIComponent(OP)+'&t='+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d||!d.ok){
        document.getElementById('lead').textContent =
          (d&&d.error==='bad_token') ? 'このURLでは開けません。配布された専用URLか確認してください。'
                                     : 'データを取得できませんでした。時間をおいて開き直してください。';
        return;
      }
      data=d; render(); if(isReload) toast('最新にしました');
    })
    .catch(function(){ document.getElementById('lead').textContent='通信できませんでした。電波の良いところで開き直してください。'; });
}

function render(){
  document.getElementById('who').textContent=data.opName+' さん';
  document.getElementById('lead').textContent=
    '演目ごとに、衣装を新しく買うか・いまあるものを使い回すかを入れてください。（'+data.updatedAt+' 時点）';
  document.getElementById('body').style.display='';

  document.getElementById('sTotal').textContent=yen(data.total);
  document.getElementById('sRemain').textContent=yen(data.remain);
  document.getElementById('sRemainBox').classList.toggle('over', data.remain<0);
  document.getElementById('sUndec').textContent=(data.undecided+data.untouched);

  document.getElementById('list').innerHTML=(data.items||[]).map(function(i){
    var cls = !i.state ? ' untouched' : (i.state==='未定' ? ' undec' : '');
    var seg = (data.states||[]).map(function(st){
      var on = (i.state===st) ? ' on'+(st==='未定'?' undec':'') : '';
      return '<button class="'+on.trim()+'" onclick="pick(\''+esc(i.name)+'\',\''+esc(st)+'\')">'+esc(st)+'</button>';
    }).join('');
    /* 使い回しは金額が動かないので、入力欄は新規発注のときだけ開く */
    var open = (i.state==='新規発注');
    return '<div class="card'+cls+'" id="c-'+esc(i.name)+'">'
      + '<div class="nm">'+esc(i.name)+'</div>'
      + '<div class="meta">'
        + (i.state? '' : 'まだ入力されていません')
        + (i.updatedAt? ('最終更新 '+esc(i.updatedAt)+(i.updatedBy?(' ／ '+esc(i.updatedBy)):'')) : '')
      + '</div>'
      + '<div class="seg">'+seg+'</div>'
      + '<div class="fields'+(open?' show':'')+'" id="f-'+esc(i.name)+'">'
        + '<div class="row2">'
          + '<div class="fld"><label>点数（着）</label><input type="number" inputmode="numeric" id="q-'+esc(i.name)+'" value="'+esc(i.qty)+'"></div>'
          + '<div class="fld"><label>金額（円）</label><input type="number" inputmode="numeric" id="y-'+esc(i.name)+'" value="'+esc(i.yen)+'"></div>'
        + '</div>'
        + '<div class="fld"><label>領収書URL</label><input type="url" id="r-'+esc(i.name)+'" value="'+esc(i.receipt)+'" placeholder="https://…"></div>'
        + '<div class="fld"><label>メモ</label><textarea id="m-'+esc(i.name)+'">'+esc(i.memo)+'</textarea></div>'
        + '<button class="btn" onclick="save(\''+esc(i.name)+'\')">保存する</button>'
      + '</div></div>';
  }).join('');
}

/* 状態は押した瞬間に保存する。ここで保存ボタンを挟むと「押したのに残っていない」が起きる */
function pick(name, st){
  if(busy) return; busy=true;
  post({survey:'costume_update',op:OP,name:name,state:st}).then(function(res){
    busy=false;
    if(res&&res.ok){ toast(name+'：'+st); load(false); }
    else { toast('保存できませんでした：'+((res&&res.error)||'')); }
  }).catch(function(){ busy=false; toast('通信できませんでした'); });
}

function save(name){
  if(busy) return; busy=true;
  var g=function(p){ var el=document.getElementById(p+'-'+name); return el?el.value:''; };
  post({survey:'costume_update',op:OP,name:name,
        qty:g('q'), yen:g('y'), receipt:g('r'), memo:g('m')}).then(function(res){
    busy=false;
    if(res&&res.ok){ toast(name+'を保存しました'); load(false); }
    else { toast('保存できませんでした：'+((res&&res.error)||'')); }
  }).catch(function(){ busy=false; toast('通信できませんでした。もう一度お試しください'); });
}

function post(body){
  return fetch(BASE,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)}).then(function(r){ return r.json(); });
}

load(false);
</script>
</body>
</html>
