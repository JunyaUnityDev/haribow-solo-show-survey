<script>
/* ★GAS宛てのfetchはCookieを付けない（2026-09-24）。Googleにログイン中のブラウザだと
   Cookie付きでGASへ行き「現在、ファイルを開くことができません」(404のHTML)が返り、
   読み込みも送信も失敗する。curlでは再現しない。個別に credentials を指定した呼び出しはそのまま。 */
(function(){
  var f = window.fetch; if(!f) return;
  window.fetch = function(u, o){
    var s = typeof u === 'string' ? u : (u && u.url) || '';
    if(/^https:\/\/script\.google(usercontent)?\.com\//.test(s) && !(o && o.credentials)){
      o = Object.assign({}, o, { credentials:'omit' });
    }
    return f.call(this, u, o);
  };
})();
</script>

var qs=new URLSearchParams(location.search);

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* シートには **ここを強調** という書き方が入っている。記号のまま出していたので太字にする。
   エスケープしてから変換するので、タグを書かれても素通りしない（2026-09-21） */
function md(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/★/g,'<b>★</b>'); }
/* 注釈は1行に詰め込むと読めない。★ と ／ で折る（2026-09-21） */
function mdBlock(s){
  return md(s).replace(/\s*<b>★<\/b>\s*/g,'<br><b>★</b>').replace(/\s*／\s*/g,'<br>／ ')
              .replace(/^<br>/,'');
}

try{ ME = qs.get('name') || localStorage.getItem('hbw_stage_me') || ''; }catch(e){ ME = qs.get('name')||''; }

/* v2＝『GoBEYOND 演者スタッフシート』を読む版（2026-09-26）。GAS側が未デプロイ・失敗なら従来の出ハケ（v1）で出す */
function getJson(page){ return fetch(BASE+'?page='+page).then(function(r){return r.json();}); }
getJson('stagemove2').then(function(d){ if(d && d.ok && d.v2) return d; throw new Error('no v2'); })

/* 表示名（ダッチャーネーム）。『名簿マッピング』E列にあればそれ、無ければニックネームのまま。
   推測で当てない——記録に無い人はニックネーム表示で正しい。 */
function dn(n){ return (D.display && D.display[n]) || n; }

/* そのブロックに誰が出ているか */
function castOf(name){
  if(!D.cast) return [];
  if(D.cast[name]) return D.cast[name];
  for(var k in D.cast){ if(k.slice(0,14)===name.slice(0,14)) return D.cast[k]; }
  return [];
}
/* 入・続・出をその場で計算する（シートの人数は作成時点の参考値なので使わない） */
function flow(i){
  var p=D.program, cur=castOf(p[i].name);
  var prev=i>0?castOf(p[i-1].name):[], next=i<p.length-1?castOf(p[i+1].name):[];
  var inS=cur.filter(function(x){return prev.indexOf(x)<0;});
  var stay=cur.filter(function(x){return prev.indexOf(x)>=0;});
  var outS=cur.filter(function(x){return next.indexOf(x)<0;});
  return {cur:cur, "in":inS, stay:stay, out:outS};
}
function mv(name){ return (D.moves && (D.moves[name]||null)) || {"in":"",out:"",props:"",memo:""}; }
/* その人のそのブロックでの入り／ハケ。B部の個人指定があればそれが優先、無ければブロック共通 */
function ioFor(person, block, field){
  var pp = D.perPerson && D.perPerson[person];
  if(pp){
    for(var k in pp){
      if(block===k || block.slice(0,k.length)===k){
        var o = pp[k], v = (typeof o==='string') ? o : (o&&o[field]);
        if(v) return {v:v, own:true};
        break;
      }
    }
  }
  return {v: mv(block)[field]||'', own:false};
}
/* A〜Dは客席の「扉」。演者は扉の外で待機して、そこから入場する。席に座るわけではない。
   図は、どの扉かを分かるようにするためだけに出している（2026-09-20 坂田の指摘で修正）。 */
function seatMapHtml(){
  return '<div class="map"><h2>客席 A〜D の扉はここ</h2>'+
    '<p><b>A〜Dは客席の扉です。</b>扉の外で待機して、そこから入場します（席に座るわけではありません）。<br>'+
    '1階席のみ。2階席は使いません。</p>'+
    '<img src="media/seatmap_zones.png" alt="めぐろパーシモンホール 1階席。A〜Dの扉の位置" loading="lazy">'+
    '<div class="zones">'+
      '<span><b>A</b> 下手・前方の扉</span>'+
      '<span><b>D</b> 上手・前方の扉</span>'+
      '<span><b>B</b> 下手・後方の扉</span>'+
      '<span><b>C</b> 上手・後方の扉</span>'+
    '</div>'+
    '<p style="margin:10px 0 0">客席から見て左が下手、右が上手です。</p></div>';
}
/* 入りの書き方から「どこに集合するか」を出す。舞台に居続ける人には集合場所が無い */
function standbyOf(v){
  v = v||'';
  /* アンコールの登場場所（2026-09-26 松澤竜介のLINE）。花道・客席ドアは袖ではないのでそのまま出す */
  var dr = v.match(/([A-D])扉/);
  if(dr) return '客席 '+dr[1]+' の扉の外';
  var h = v.match(/(客席ドア|花道)\s*([上下]手)/);
  if(h) return h[1]==='客席ドア' ? '客席ドア（'+h[2]+'）の外' : h[2]+'側の花道';
  var m = v.match(/客席\s*([A-D])/);
  if(m) return '客席 '+m[1]+ ' の扉の外';
  if(/舞台上|続き|そのまま|登場しない/.test(v)) return '';
  if(v.indexOf('上手')>=0 && v.indexOf('下手')>=0) return '上手袖／下手袖（自分の側）';
  if(v.indexOf('上手')>=0) return '上手袖';
  if(v.indexOf('下手')>=0) return '下手袖';
  return '';
}
/* 値の出し方。空＝未定、「—」始まり＝該当なし、チーム裁量＝チームで決めてよい */
/* 入り・ハケの値は「場所　補足」の形。場所を太字にして一目で分かるように（2026-09-27）。
   全角スペースが無い短い値（「上手」「下手」等）は全体を太字 */
function placeBold(v){
  var i=v.indexOf('　');
  if(i>0) return '<b>'+md(v.slice(0,i))+'</b>　'+md(v.slice(i+1));
  return v.length<=12 ? '<b>'+md(v)+'</b>' : md(v);
}
function ioHtml(label, cls, r){
  var v = r.v||'';
  if(!v) return '<span class="'+cls+'"><em class="val"><i class="todo">まだ決まっていません</i></em></span>';
  if(v.charAt(0)==='—') return '<span class="'+cls+' na"><em class="val">'+md(v)+'</em></span>';
  if(/チーム裁量|チームで決め|各自で決め|自由/.test(v))
    return '<span class="'+cls+' free"><em class="val">'+placeBold(v)+
      '　<b class="lv">チームで決めてOK</b></em></span>';
  return '<span class="'+cls+'"><em class="val">'+placeBold(v)+'</em></span>';
}

/* ============================================================
 *  前日リハーサル・当日の入り時間（2026-09-25）
 *  データは D.tt（GASが『Go BEYOND 2026 TIMETABLE』の TT_9/28・TT_9/29 と演者スケジュールを読む）。
 *  時間割の行が自分の演目かどうかは、行の名前と構成台本のブロック名の頭で突き合わせる。
 * ============================================================ */
function nz(s){ return String(s||'').replace(/[\s　]/g,'').toLowerCase(); }
var TT_ALIAS={ 'ddcj':'DOUBLE DUTCH CONTEST JAPAN 2023', 'airfootworks':'AIR FOOTWORKS' };
function ttBlock(title){
  var t=nz(title); if(!t || /^映像|^mc/.test(t)) return null;
  for(var k in TT_ALIAS){ if(t.indexOf(k)===0){ t=nz(TT_ALIAS[k]); break; } }
  var p=D.program||[];
  for(var i=0;i<p.length;i++){
    var b=nz(p[i].name), n=Math.min(4, b.length, t.length), j=0;
    while(j<b.length && j<t.length && b[j]===t[j]) j++;
    if(j>=n && n>=2) return p[i].name;
  }
  return null;
}
/* その行に自分が関係するか：'me'＝自分が出る演目、'all'＝全員、''＝関係なし
   ★備考の「全員○」「全員揃う」は**その演目のメンバー全員**の意味。出演者全員ではない
     （9/29「Roar 全員○」で、Roarに出ない人にまで全員と出ていた）。全員扱いはランスルーリハだけ */
function ttMark(r){
  if(/演者なし/.test(r.note)) return '';
  if(/ランスルーリハ/.test(r.title)) return 'all';
  var b=ttBlock(r.title);
  return (b && castOf(b).indexOf(ME)>=0) ? 'me' : '';
}
function ttRowsHtml(rows, withMark){
  return rows.map(function(r){
    var mk = withMark ? ttMark(r) : '';
    return '<div class="ttr'+(mk==='me'?' me':'')+'"><div class="tm">'+esc(r.t)+'</div><div>'+
      '<span class="k">'+esc(r.kind)+'</span><span class="ti">'+esc(r.title)+'</span>'+
      (mk==='me'?'<span class="tag">自分</span>':mk==='all'?'<span class="tag all">全員</span>':'')+
      (r.note?'<div class="nt">'+esc(r.note)+'</div>':'')+'</div></div>';
  }).join('');
}
function arriveHtml(){
  var tt=D.tt; if(!tt || !tt.ok || !(tt.days||[]).length) return '';
  var out=['<div class="arrive"><h2>入り時間とリハーサル</h2>'];
  tt.days.forEach(function(day){
    var a=day.arrivals && day.arrivals[ME];
    var av=(tt.avail && tt.avail[ME] && tt.avail[ME][day.date]) || '';
    var line;
    if(a) line='<div class="at">'+esc(a.t)+' 入り</div>'+(a.memo?'<div class="sub">'+esc(a.memo)+'</div>':'');
    else if(av==='×') line='<div class="at none">この日は来ない予定です</div>';
    else line='<div class="at none">入り時間はまだ決まっていません'+
      (av?'（参加できる時間：'+esc(av)+'）':'')+'</div>';
    var mine=(day.rows||[]).filter(function(r){ return ttMark(r)==='me'; });
    var alls=(day.rows||[]).filter(function(r){ return ttMark(r)==='all'; });
    var ls=[];
    if(mine.length) ls.push('自分が出るリハ：<b>'+mine.map(function(r){return esc(r.t)+' '+esc(r.title);}).join('</b>／<b>')+'</b>');
    if(alls.length) ls.push('全員：'+alls.map(function(r){return esc(r.t)+' '+esc(r.title);}).join('／'));
    out.push('<div class="day"><div class="dl">'+esc(day.label)+'</div>'+line+
      (ls.length?'<div class="mine">'+ls.join('<br>')+'</div>':'')+
      '<details class="tt"><summary>この日の時間割を全部見る</summary>'+ttRowsHtml(day.rows||[], true)+'</details></div>');
  });
  out.push('</div>');
  return out.join('');
}
/* 全体タブ用：時間割と入り時間表をそのまま */
function arriveAllHtml(){
  var tt=D.tt; if(!tt || !tt.ok || !(tt.days||[]).length) return '';
  return tt.days.map(function(day){
    return '<div class="arrive"><h2>'+esc(day.label)+'</h2>'+ttRowsHtml(day.rows||[], false)+
      '<div style="margin-top:10px;font-size:12px;font-weight:700">入り時間</div>'+
      (day.arrivalList||[]).map(function(a){
        return '<div class="ttr"><div class="tm">'+esc(a.t)+'</div><div>'+esc(a.who)+
          (a.memo?'<div class="nt">'+esc(a.memo)+'</div>':'')+'</div></div>'; }).join('')+'</div>';
  }).join('');
}

function kindOf(n){ return (D.people && D.people[n] && D.people[n].kind) || '演者'; }
function renderNames(){
  var box=el('names'); box.innerHTML='';
  var groups = D.v2 ? [['演者', function(n){ return /演者/.test(kindOf(n)); }],
                       ['スタッフ', function(n){ return !/演者/.test(kindOf(n)); }]]
                    : [['', function(){ return true; }]];
  groups.forEach(function(g){
    var list=(D.members||[]).filter(g[1]); if(!list.length) return;
    if(g[0]){ var h=document.createElement('h3'); h.textContent=g[0]; box.appendChild(h); }
    list.forEach(function(n){
      var b=document.createElement('button'); b.type='button'; b.textContent=dn(n);
      if(kindOf(n)==='演者＋スタッフ'){ var sm=document.createElement('small'); sm.textContent='スタッフも'; b.appendChild(sm); }
      b.dataset.nick=n;
      var pe=D.people && D.people[n]; b.dataset.yobi=(pe && pe.yobi)||'';
      b.onclick=function(){ pick(n); };
      box.appendChild(b);
    });
  });
  el('q').addEventListener('input', function(){
    var v=this.value.trim();
    Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
      b.hidden = v && b.textContent.indexOf(v)<0 && (b.dataset.nick||'').indexOf(v)<0 && (b.dataset.yobi||'').indexOf(v)<0;
    });
  });
}
function pick(n){
  if((D.members||[]).indexOf(n)<0) return;
  ME=n; try{ localStorage.setItem('hbw_stage_me', n); }catch(e){}
  el('pickBox').hidden=true; renderMine();
}
function reset(){ el('pickBox').hidden=false; el('mine').hidden=true; el('q').value='';
  Array.prototype.forEach.call(el('names').querySelectorAll('button'),function(b){b.hidden=false;}); }

/* ============================================================
 *  v2：演者スタッフシートの『動き』（D.acts）。1行＝1人の動き1つ。
 *  入り・ハケ（個人）は GAS 側で perPerson にも入っていて、従来の「入り／ハケ」欄に出る。
 *  それ以外（役割・スタッフ作業・着替え・待機・持ち物・その他）はカードの下に並べる。
 * ============================================================ */
function actsOf(k){ return (D.acts && D.acts[k]) || []; }
function isIoOwn(a){ return a.day==='本番' && !a.group && (a.type==='入り'||a.type==='ハケ'); }
var TYPE_ORDER=['集合','役割','待機','スタッフ作業','着替え','持ち物','入り','ハケ','その他'];
function byType(x,y){ return TYPE_ORDER.indexOf(x.type)-TYPE_ORDER.indexOf(y.type); }
function changeHtml(a){
  var rest=(a.what||'').replace(/^このあと早着替え/,'').replace(/^（([\s\S]*)）$/,'$1');
  /* 場所が「◯◯が決める」「未定」のときは「〜で着替え」「〜に持って行く」の文にしない（2026-09-26） */
  var fixed = a.where && !/決め|未定|裁量/.test(a.where);
  return '<div class="quick">⚠ <b>この演目のあと、'+(fixed? esc(a.where)+'で早着替え':'早着替え')+'</b>'+(rest?'（'+md(rest)+'）':'')+
    (!fixed && a.where? '<br>場所：'+esc(a.where):'')+
    (a.items? '<br><b>'+esc(a.items)+'を'+(fixed? esc(a.where)+'に':'')+'持って行く</b>':'')+
    (a.memo? '<br>'+md(a.memo):'')+'</div>';
}
var TYPE_LABEL={'スタッフ作業':'係'};
function actHtml(a, showWhen){
  if(a.type==='着替え' && !showWhen) return changeHtml(a);
  return '<div class="act"><span class="ty t-'+esc(a.type||'その他')+'">'+esc(TYPE_LABEL[a.type]||a.type||'その他')+'</span><div>'+
    (showWhen && a.when? '<b>'+esc(a.when)+'</b>　':'')+
    (a.where? '<b>'+esc(a.where)+'</b>　':'')+md(a.what||'')+
    (a.items? '<div class="it">持ち物：'+md(a.items)+'</div>':'')+
    (a.memo? '<div class="nt">'+mdBlock(a.memo)+'</div>':'')+
    (a.group? '<div class="nt">（'+esc(a.group)+'向け）</div>':'')+'</div></div>';
}
/* 持ち物：『人』の持ち物＋『動き』の持ち物欄＋出る演目の衣装（『演目』H列）。すべてシートから。
   「A／B」は別々の物として分け、同じ物は1つにまとめて「何で使うか」を並べる（2026-09-27 JUNYA：ジャージが2回出ていた）。
   チェックはこの端末にだけ残る（無くても表示は壊れない） */
function kitHtml(){
  var map={}, order=[], pe=D.people && D.people[ME];
  function push(txt, src){
    String(txt||'').split(/[、,，\n／]+/).forEach(function(t){
      t=t.trim(); if(!t) return;
      if(!map[t]){ map[t]=[]; order.push(t); }
      if(src && map[t].indexOf(src)<0) map[t].push(src);
    });
  }
  if(pe && pe.items) push(pe.items, '');
  (D.program||[]).forEach(function(b){
    var m=D.moves && D.moves[b.name];
    if(m && m.kit && castOf(b.name).indexOf(ME)>=0) push(m.kit, b.name);
  });
  actsOf(ME).forEach(function(a){
    if(!a.items) return;
    push(a.items, (a.day==='本番'?'':a.day+' ')+(a.when||'')+(a.type==='着替え'?'のあと着替え':''));
  });
  if(!order.length) return '';
  var saved={}; try{ saved=JSON.parse(localStorage.getItem('hbw_kit_'+ME)||'{}'); }catch(e){}
  return '<div class="kit"><h2>持ち物（'+order.length+'）</h2>'+order.map(function(t){
    var src=map[t].filter(Boolean).join('・');
    return '<label><input type="checkbox" data-k="'+esc(t)+'"'+(saved[t]?' checked':'')+' onchange="kitSave(this)">'+
      '<span><b>'+md(t)+'</b>'+(src?'<span class="src">'+esc(src)+'</span>':'')+'</span></label>';
  }).join('')+'</div>';
}
function kitSave(cb){
  try{ var o=JSON.parse(localStorage.getItem('hbw_kit_'+ME)||'{}');
       if(cb.checked) o[cb.dataset.k]=1; else delete o[cb.dataset.k];
       localStorage.setItem('hbw_kit_'+ME, JSON.stringify(o)); }catch(e){}
}
/* ============================================================
 *  自分の画面（2026-09-27 作り直し・JUNYA「最高にわかりやすく」）
 *  上のボタン4つで切り替える：持ち物／9/28 前日／9/29 リハ／9/29 本番。開いた日で最初の画面が決まる。
 *  1行目は「時刻＋やること」だけ。理由・補足は「くわしく」に畳む。
 * ============================================================ */
var SUB='';
function defaultSub(){
  var n=new Date(), j=new Date(n.getTime()+(n.getTimezoneOffset()+540)*60000), m=j.getMonth()+1, d=j.getDate();
  if(m===9 && d===29) return j.getHours()>=18 ? 'show' : 'd29';
  if(m===9 && d===28) return 'd28';
  if(m>9 || (m===9 && d>29)) return 'show';
  return 'kit';
}
function setSub(x){ SUB=x; renderMine(); window.scrollTo(0, Math.min(window.scrollY, el('mine').offsetTop)); }
function tmin(w){ var m=String(w||'').match(/^(\d{1,2}):(\d{2})/); return m? m[1]*60+ +m[2] : -1; }
/* 「16:45〜17:45 AGTリハ」→ 時刻と中身に分ける */
function splitWhen(w){
  var m=String(w||'').match(/^(\d{1,2}:\d{2})(?:\s*[〜~-]\s*(\d{1,2}:\d{2})?)?\s*(.*)$/);
  return m? {t:m[1], t2:m[2]||'', title:m[3]} : {t:'', t2:'', title:w||''};
}

/* 前日・当日リハの1日分 */
function dayHtml(date){
  var out=[], day=null;
  ((D.tt && D.tt.ok && D.tt.days) || []).forEach(function(x){ if(x.date===date) day=x; });
  var a=day && day.arrivals && day.arrivals[ME];
  var av=(D.tt && D.tt.avail && D.tt.avail[ME] && D.tt.avail[ME][date]) || '';
  out.push('<div class="hero"><div class="k">'+esc(date==='9/28'?'9/28（月）前日リハーサル':'9/29（火）当日')+'　入り時間</div>'+
    (a? '<div class="v">'+esc(a.t)+'</div>'+(a.memo?'<div class="s">'+esc(a.memo)+'</div>':'')
      : '<div class="v none">'+(av==='×'?'この日は来ない予定です':'入り時間はまだ決まっていません')+'</div>')+'</div>');
  var all=actsOf(ME).filter(function(x){ return x.day===date+'リハ'; });
  var notes=all.filter(function(x){ return !x.when; });
  var rows=all.filter(function(x){ return x.when; })
    .sort(function(x,y){ var a=tmin(x.when), b=tmin(y.when); return (a<0?9999:a)-(b<0?9999:b); });
  if(notes.length) out.push('<div class="hero" style="padding:10px 15px;font-size:13px">'+notes.map(function(x){
    return '・'+md(x.what); }).join('<br>')+'</div>');
  if(!rows.length) out.push('<div class="empty">この日の予定はまだありません。</div>');
  else out.push('<div class="tl">'+rows.map(function(x){
    var w=splitWhen(x.when);
    var title = w.title || (x.type==='持ち物' ? '持ち物' : '');
    var body=(x.where?'<b>'+esc(x.where)+'</b>'+(x.what?'　':''):'')+(x.what?md(x.what):'');
    return '<div class="row'+(x.group?' all':'')+'"><div class="t">'+esc(w.t||'—')+(w.t2?'<small>〜'+esc(w.t2)+'</small>':'')+'</div><div>'+
      (title?'<div class="ti">'+esc(title)+'</div>':'')+
      (body?'<div class="b">'+body+'</div>':'')+
      (x.items?'<div class="b">持ち物：'+md(x.items)+'</div>':'')+

    var changes=extra.filter(function(a){ return a.type==='着替え'; }).map(changeHtml).join('');
    var others=extra.filter(function(a){ return a.type!=='着替え'; });
    var stand=standbyOf(entry.v), cue=i>=2? p[i-2] : (i===1? p[0] : null);
    /* 移動の行。前の演目から続けて出る人でも、扉・花道から入るなら回り込みが要る（ED→アンコール） */
    if(stand && !isStay)
      rows.push(tlRow(cue? cue.st : '19:30', '', 'move', '<b>'+esc(stand)+'</b> へ',

      more.push('<div class="x"><b>この演目の全員共通</b><br>'+mdBlock([m["in"], m.out].filter(Boolean).join(' ／ '))+'</div>');

/* 次の予定（2026-09-27）。開いた時刻から、自分の予定のうち次に来るものを1つ出す。当日スクロールせずに分かるように */
function nextHtml(){
  var items=[];
  function add(ymd, t, text){ var m=tmin(t); if(m<0) return; items.push({at:new Date(ymd+'T'+('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)+':00+09:00'), t:t, text:text}); }
  [['9/28','2026-09-28'],['9/29','2026-09-29']].forEach(function(d){
    var day=((D.tt&&D.tt.days)||[]).filter(function(x){ return x.date===d[0]; })[0], a=day&&day.arrivals&&day.arrivals[ME];
    if(a) add(d[1], a.t, d[0]+' 会場入り');
    actsOf(ME).forEach(function(x){ if(x.day===d[0]+'リハ' && x.when){ var w=splitWhen(x.when); add(d[1], w.t, d[0]+' '+(w.title||x.what)); } });
  });
  (D.program||[]).forEach(function(b){
    var here=actsOf(ME).some(function(a){ return a.day==='本番' && a.when===b.name; });
    if(castOf(b.name).indexOf(ME)>=0 || here) add('2026-09-29', b.st, '本番 '+b.name);
  });
  items.sort(function(x,y){ return x.at-y.at; });
  var now=new Date(), nx=items.filter(function(x){ return x.at>=now; })[0];
  if(!nx) return '';
  var mins=Math.round((nx.at-now)/60000);
  var when = mins<60 ? 'あと'+mins+'分' : mins<24*60 ? 'あと'+Math.floor(mins/60)+'時間'+(mins%60?mins%60+'分':'') : '';
  return '<div class="next"><span class="k">次の予定</span><b>'+esc(nx.t)+'</b> '+esc(nx.text)+(when?'<span class="k">（'+when+'）</span>':'')+'</div>';
}

/* 全員の行を「いつ・どこ・やること」でまとめて、担当者を並べる（同じ仕事の人を1行に） */
function groupActs(filter){
  var map={}, order=[];
  Object.keys(D.acts||{}).forEach(function(k){
    actsOf(k).forEach(function(a){
      if(!filter(a)) return;
      var key=a.when+'|'+a.where+'|'+a.what;
      if(!map[key]){ map[key]={a:a, who:[]}; order.push(key); }
      var n=a.group||dn(k); if(map[key].who.indexOf(n)<0) map[key].who.push(n);
    });
  });
  return order.map(function(k){ return map[k]; });
}

      (showWhen? '<span class="k">'+esc(a.when)+'</span>':'')+md(a.what.replace(/^\d{1,2}:\d{2}[〜~]?\s*/,''))+
      '<div class="nt"><b style="color:var(--ink)">'+esc(g.who.join('・'))+'</b>'+(a.memo?'　'+esc(a.memo):'')+'</div></div></div>';
  }).join('');
