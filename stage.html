<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>舞台の出ハケ｜Go BEYOND</title>
<style>
  :root{
    --bg:#f4f1ec; --panel:#fffdfa; --line:#ddd6cb; --ink:#2e2a24; --dim:#7d7466;
    --accent:#6b5f4e; --accent-ink:#fffdfa; --in:#4e6b57; --out:#8a5a48; --stay:#7d7466;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1c1a17; --panel:#252220; --line:#3b3631; --ink:#ece7de; --dim:#9a9184;
      --accent:#a9997f; --accent-ink:#1c1a17; --in:#8fb59b; --out:#c99078; --stay:#9a9184;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1a17; --panel:#252220; --line:#3b3631; --ink:#ece7de; --dim:#9a9184;
    --accent:#a9997f; --accent-ink:#1c1a17; --in:#8fb59b; --out:#c99078; --stay:#9a9184;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
       line-height:1.7;-webkit-text-size-adjust:100%}
  .wrap{max-width:660px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px 14px}
  header img{height:22px;width:auto}
  .tabs{display:flex;gap:6px}
  .tabs button{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
       color:var(--ink);font-size:12px;font-family:inherit;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  h1{font-size:19px;margin:10px 0 2px;letter-spacing:.02em}
  .lead{color:var(--dim);font-size:13px;margin:0 0 18px}
  .pick{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .pick label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  input[type=search],select{width:100%;padding:11px 12px;font-size:16px;border:1px solid var(--line);
       border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
  .names{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .names button{padding:7px 11px;border:1px solid var(--line);border-radius:18px;background:var(--bg);
       color:var(--ink);font-size:13px;font-family:inherit;cursor:pointer}
  .names button:hover{border-color:var(--accent)}
  .me{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
  .me b{font-size:22px}
  .me a{font-size:12px;color:var(--dim)}
  .sum{font-size:13px;color:var(--dim);margin:0 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px}
  .card.gap{background:transparent;border-style:dashed;padding:8px 15px;text-align:center;color:var(--dim);font-size:12px}
  .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .time{font-size:15px;font-weight:700;letter-spacing:.02em;flex:none}
  .bn{font-size:16px;font-weight:700}
  .meta{font-size:11px;color:var(--dim);margin-top:1px}
  .io{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .io span{font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);font-weight:700}
  .io .i{color:var(--in)}.io .o{color:var(--out)}.io .s{color:var(--stay);font-weight:400}
  .io .todo{color:var(--dim);font-weight:400;font-style:italic}
  .props{margin-top:8px;font-size:12px;color:var(--dim);padding-top:8px;border-top:1px solid var(--line)}
  .io .free{color:var(--in);font-weight:400}
  .io .na{color:var(--dim);font-weight:400}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}
  th{background:var(--bg);font-size:11px}
  td.c{text-align:center;white-space:nowrap}
  /* スマホ：7列の表は入らないので、1ブロック＝1枚のカードに畳む（横スクロールを出さない） */
  @media (max-width:620px){
    .wrap{padding:16px 16px 48px}
    header img{height:18px}
    .me b{font-size:20px}
    table,thead,tbody,tr,th,td{display:block}
    thead{display:none}
    tr{background:var(--panel);border:1px solid var(--line);border-radius:12px;
       padding:10px 12px;margin-bottom:10px}
    td{border:0;padding:2px 0;font-size:13px}
    td.c{text-align:left;white-space:normal}
    td::before{content:attr(data-l) "：";color:var(--dim);font-size:11px;margin-right:4px}
    td[data-l="ブロック"]::before{content:none}
    td[data-l="ブロック"]{font-size:15px;margin-bottom:4px}
  }
  .note{font-size:12px;color:var(--dim);margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .err{color:var(--out);font-weight:700}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="https://junyaunitydev.github.io/haribow-audition-second-site/assets/haribow-logo.png" alt="HARIBOW">
    <div class="tabs">
      <button id="tMe" aria-pressed="true" onclick="setTab('me')">自分の出番</button>
      <button id="tAll" aria-pressed="false" onclick="setTab('all')">全体</button>
    </div>
  </header>

  <h1>舞台の出ハケ</h1>
  <p class="lead">2026年9月29日（火）めぐろパーシモンホール 大ホール／開演19:30<br>
    <span id="upd"></span></p>

  <div id="loading">読み込んでいます…</div>
  <div id="fail" class="err" hidden></div>

  <div id="viewMe" hidden>
    <div class="pick" id="pickBox">
      <label for="q">名前を選ぶ</label>
      <input type="search" id="q" placeholder="名前の一部を入れる（例：まほろ）" autocomplete="off">
      <div class="names" id="names"></div>
    </div>
    <div id="mine" hidden></div>
  </div>

  <div id="viewAll" hidden></div>

  <p class="note">
    <b>「まだ決まっていません」</b>＝運営がこれから決めます。<b>「チームで決めてOK」</b>＝その演目のチームで決めて構いません。
    <b>「—」</b>で始まるものは、そもそも出入りが無いところです。<br>
    袖のどこから、までは決めていません。<b>細部は当日リハーサル（9/29 14:00〜16:30）で決めます。</b><br>
    このページは『出ハケ』シートと構成台本をそのまま読んでいます。順番や尺が変わると自動で変わります。
  </p>
</div>

<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var D=null, TAB='me', ME='';
var qs=new URLSearchParams(location.search);

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

try{ ME = qs.get('name') || localStorage.getItem('hbw_stage_me') || ''; }catch(e){ ME = qs.get('name')||''; }

fetch(BASE+'?page=stagemove').then(function(r){return r.json();}).then(function(d){
  if(!d || !d.ok) throw new Error('bad');
  D=d; el('loading').hidden=true; el('upd').textContent='最終更新 '+(d.updatedAt||'');
  renderNames(); setTab(TAB); if(ME) pick(ME);
}).catch(function(){
  el('loading').hidden=true;
  el('fail').hidden=false;
  el('fail').textContent='読み込めませんでした。電波の良い場所でページを開き直してください。';
});

/* 表示名（ダッチャーネーム）。『名簿マッピング』E列にあればそれ、無ければニックネームのまま。
   推測で当てない——記録に無い人はニックネーム表示で正しい。 */
function dn(n){ return (D.display && D.display[n]) || n; }

/* そのブロックに誰が出ているか */
function castOf(name){
  if(!D.cast) return [];
  if(D.cast[name]) return D.cast[name];
  for(var k in D.cast){ if(k.slice(0,14)===name.slice(0,14)) return D.cast[k]; }
  return [];
}
/* 入・続・出をその場で計算する（シートの人数は作成時点の参考値なので使わない） */
function flow(i){
  var p=D.program, cur=castOf(p[i].name);
  var prev=i>0?castOf(p[i-1].name):[], next=i<p.length-1?castOf(p[i+1].name):[];
  var inS=cur.filter(function(x){return prev.indexOf(x)<0;});
  var stay=cur.filter(function(x){return prev.indexOf(x)>=0;});
  var outS=cur.filter(function(x){return next.indexOf(x)<0;});
  return {cur:cur, "in":inS, stay:stay, out:outS};
}
function mv(name){ return (D.moves && (D.moves[name]||null)) || {"in":"",out:"",props:"",memo:""}; }
/* その人のそのブロックでの入り／ハケ。B部の個人指定があればそれが優先、無ければブロック共通 */
function ioFor(person, block, field){
  var pp = D.perPerson && D.perPerson[person];
  if(pp){
    for(var k in pp){
      if(block===k || block.slice(0,k.length)===k){
        var o = pp[k], v = (typeof o==='string') ? o : (o&&o[field]);
        if(v) return {v:v, own:true};
        break;
      }
    }
  }
  return {v: mv(block)[field]||'', own:false};
}
/* 値の出し方。空＝未定、「—」始まり＝該当なし、チーム裁量＝チームで決めてよい */
function ioHtml(label, cls, r){
  var v = r.v||'';
  if(!v) return '<span class="'+cls+'">'+label+'：<i class="todo">まだ決まっていません</i></span>';
  if(v.charAt(0)==='—') return '<span class="na">'+label+'：'+esc(v)+'</span>';
  if(/チーム裁量|チームで決め|各自で決め|自由/.test(v))
    return '<span class="free">'+label+'：'+esc(v)+'（チームで決めてOK）</span>';
  return '<span class="'+cls+'">'+label+'：'+esc(v)+(r.own?'（あなた指定）':'')+'</span>';
}

function renderNames(){
  var box=el('names'); box.innerHTML='';
  (D.members||[]).forEach(function(n){
    var b=document.createElement('button'); b.type='button'; b.textContent=dn(n);
    b.dataset.nick=n;
    b.onclick=function(){ pick(n); };
    box.appendChild(b);
  });
  el('q').addEventListener('input', function(){
    var v=this.value.trim();
    Array.prototype.forEach.call(box.children, function(b){
      b.hidden = v && b.textContent.indexOf(v)<0 && (b.dataset.nick||'').indexOf(v)<0;
    });
  });
}
function pick(n){
  if((D.members||[]).indexOf(n)<0) return;
  ME=n; try{ localStorage.setItem('hbw_stage_me', n); }catch(e){}
  el('pickBox').hidden=true; renderMine();
}
function reset(){ el('pickBox').hidden=false; el('mine').hidden=true; el('q').value='';
  Array.prototype.forEach.call(el('names').children,function(b){b.hidden=false;}); }

function renderMine(){
  var host=el('mine'); host.hidden=false;
  var p=D.program, out=[];
  out.push('<p class="me"><b>'+esc(dn(ME))+'</b><a href="javascript:reset()">別の人を選ぶ</a></p>');
  var mine=[];
  for(var i=0;i<p.length;i++){ if(castOf(p[i].name).indexOf(ME)>=0) mine.push(i); }
  out.push('<p class="sum">出番は <b>'+mine.length+'</b> ブロック（全'+p.length+'ブロック中）</p>');
  if(!mine.length){ out.push('<div class="card">この公演での出番はありません。</div>'); host.innerHTML=out.join(''); return; }

  var prevIdx=null;
  mine.forEach(function(i){
    var b=p[i], f=flow(i), m=mv(b.name);
    var isStay = f.stay.indexOf(ME)>=0;
    var goesOn = (i<p.length-1) && castOf(p[i+1].name).indexOf(ME)>=0;   // 次のブロックにも出る
    /* 出番が飛んでいる時だけ「この間は出番なし」。
       隣り合うブロックで出していたので「20:36〜20:36」のような空の帯が出ていた（2026-09-20 修正） */
    if(prevIdx!==null && i>prevIdx+1){
      out.push('<div class="card gap">↓ この間は出番なし（'+esc(p[prevIdx].en)+' 〜 '+esc(b.st)+'）</div>');
    }
    /* 入りもハケも必ず出す。「次のブロックにも出るから」とハケを隠すと、
       袖が変わる人（例：DDCJ2023で下手へハケて、Cirqueに下手から入り直す）の動きが消える */
    var io=[ ioHtml('入り','i', ioFor(ME,b.name,'in')), ioHtml('ハケ','o', ioFor(ME,b.name,'out')) ];
    var notes=[];
    if(isStay){
      var pg = i>0 ? Math.round(p[i-1].trans*60) : 0;
      notes.push('前の「'+esc(p[i-1].name)+'」にも出ています（転換'+pg+'秒）。'+
        (pg===0 ? '間が0秒なので、出たままか一度捌くかは上の入り・ハケのとおりに。'
                : '上のハケ・入りが違う袖なら、ここで一度捌いて入り直します。'));
    }
    if(goesOn){
      notes.push('このあと間を置かず「'+esc(p[i+1].name)+'」に続けて出ます（転換'+
        Math.round(b.trans*60)+'秒）。');
    }
    out.push('<div class="card"><div class="top"><span class="time">'+esc(b.st)+'〜'+esc(b.en)+'</span>'+
      '<span class="bn">'+esc(b.name)+'</span></div>'+
      '<div class="meta">'+esc(b.kind)+' ／ 尺'+esc(b.dur)+'分 ／ 出演'+f.cur.length+'名</div>'+
      '<div class="io">'+io.join('')+'</div>'+
      (notes.length? '<div class="props">'+notes.join('<br>')+'</div>':'')+
      (m.props? '<div class="props">舞台で動かすもの：'+esc(m.props)+'</div>':'')+
      '</div>');
    prevIdx=i;
  });
  host.innerHTML=out.join('');
}

function renderAll(){
  var p=D.program, rows=[];
  for(var i=0;i<p.length;i++){
    var b=p[i], f=flow(i), m=mv(b.name);
    var dash='<i class="todo">—</i>';
    rows.push('<tr><td class="c" data-l="#">'+b.n+'</td><td class="c" data-l="時刻">'+esc(b.st)+' 〜 '+esc(b.en)+'</td>'+
      '<td data-l="ブロック"><b>'+esc(b.name)+'</b><div class="meta">'+esc(b.kind)+' ／ 尺'+esc(b.dur)+'分 ／ 出演'+f.cur.length+'名</div></td>'+
      '<td class="c" data-l="人数">入'+f["in"].length+' ／ 続'+f.stay.length+' ／ 出'+f.out.length+'</td>'+
      '<td data-l="入り">'+(m["in"]?esc(m["in"]):dash)+'</td><td data-l="ハケ">'+(m.out?esc(m.out):dash)+'</td>'+
      '<td data-l="物の置き場所">'+(m.props?esc(m.props):dash)+'</td></tr>');
  }
  el('viewAll').innerHTML='<table><thead><tr><th>#</th><th>時刻</th><th>ブロック</th>'+
    '<th>人数</th><th>入り</th><th>ハケ</th><th>物の置き場所</th></tr></thead><tbody>'+
    rows.join('')+'</tbody></table>';
}

function setTab(t){
  TAB=t;
  el('tMe').setAttribute('aria-pressed', t==='me');
  el('tAll').setAttribute('aria-pressed', t==='all');
  el('viewMe').hidden = (t!=='me');
  el('viewAll').hidden = (t!=='all');
  if(t==='all' && D) renderAll();
}
</script>
</body>
</html>
