<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電子チケット｜HARIBOW単独公演「Go Beyond」</title>
<style>
  :root{
    --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35;
    --text:#f3f1ea; --faint:#8b919e; --sup:#c9a24b; --ok:#6fae8a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:420px;margin:0 auto;padding:22px 18px 60px}
  .logo{display:block;height:38px;width:auto;margin:0 auto 18px;opacity:.9}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .card-top{padding:18px 20px 14px;border-bottom:1px dashed var(--line);text-align:center}
  .evt{font-size:12px;letter-spacing:.08em;color:var(--sup);margin:0 0 10px}
  .name{font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.3}
  .name small{font-size:13px;font-weight:400;color:var(--faint);margin-left:4px}
  .seats{font-size:17px;font-weight:700;margin:10px 0 2px;letter-spacing:.02em}
  .qty{font-size:12px;color:var(--faint)}
  .qr-area{padding:22px 20px;text-align:center;background:#fff}
  #qr{display:inline-block;line-height:0}
  #qr img,#qr canvas{width:220px;height:220px;image-rendering:pixelated}
  .qr-note{margin:12px 0 0;font-size:11px;color:#6b7280}
  .info{padding:16px 20px 18px;font-size:13px;line-height:1.85;color:#d9d6cd}
  .info dt{color:var(--faint);font-size:11px;letter-spacing:.06em;margin-top:10px}
  .info dd{margin:0}
  .notes{margin:18px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;
    font-size:12.5px;line-height:1.9;color:var(--faint)}
  .notes b{color:var(--text)}
  .state{margin:0;padding:12px 20px;text-align:center;font-size:13px;font-weight:700}
  .state.in{background:rgba(111,174,138,.14);color:var(--ok)}
  .state.due{background:#b5544e;color:#fff;padding:16px 20px}
  .state.due b{display:block;font-size:24px;letter-spacing:.01em;margin-bottom:2px}
  .state.due span{display:block;font-size:12px;font-weight:400;opacity:.92;margin-top:4px}
  .msg{padding:40px 10px;text-align:center;line-height:2;color:var(--faint)}
  .msg b{display:block;color:var(--text);font-size:16px;margin-bottom:10px}
  a{color:#8fb7c9}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="assets/haribow-logo-white.png" alt="HARIBOW"
       onerror="this.style.display='none'">
  <div id="root"><p class="msg">読み込んでいます…</p></div>
</div>

<script src="vendor/qrcode.js"></script>
<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var token=new URLSearchParams(location.search).get('t')||'';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function msg(title,body){
  document.getElementById('root').innerHTML =
    '<p class="msg"><b>'+esc(title)+'</b>'+body+'</p>';
}

function render(d){
  var s=d.show||{};
  var html=''
   + '<div class="card">'
   + '  <div class="card-top">'
   + '    <p class="evt">ELECTRONIC TICKET</p>'
   + '    <p class="name">'+esc(d.name)+'<small>様</small></p>'
   + '    <p class="seats">'+esc(d.seats)+'</p>'
   + '    <p class="qty">'+esc(d.qty)+'名</p>'
   + '  </div>'
   + (d.cashDue
        ? '<p class="state due"><b>お支払い前です</b>現金 ¥'+Number(d.amount||0).toLocaleString()
          +'<span>当日、会場の受付でお支払いください</span></p>'
        : '')
   + (d.checkedIn ? '<p class="state in">ご入場済みです</p>' : '')
   + '  <div class="qr-area"><div id="qr"></div>'
   + '    <p class="qr-note">受付でこの画面をご提示ください<br>画面が暗いと読み取れないことがあります</p>'
   + '  </div>'
   + '  <dl class="info">'
   + '    <dt>公演</dt><dd>'+esc(s.title)+'</dd>'
   + '    <dt>日時</dt><dd>'+esc(s.date)+'　開場 '+esc(s.open)+'／開演 '+esc(s.start)+'</dd>'
   + '    <dt>会場</dt><dd>'+esc(s.venue)+'<br><span style="color:var(--faint);font-size:12px">'+esc(s.access)+'</span></dd>'
   + '    <dt>ご注文内容</dt><dd>'+esc(d.breakdown)+'</dd>'
   + '  </dl>'
   + '</div>'
   + '<div class="notes">'
   + '  <b>当日のご案内</b><br>'
   + (d.cashDue ? '  ・受付で<b>現金 ¥'+Number(d.amount||0).toLocaleString()+'</b>をお支払いください。おつりのないようご用意いただけると助かります。<br>' : '')
   + '  ・<b>画面の明るさを上げて</b>ご提示ください。暗いと読み取れないことがあります。<br>'
   + '  ・印刷は不要です。この画面をそのままご提示ください。<br>'
   + '  ・会場の電波が弱い場合に備え、<b>スクリーンショットの保存</b>をおすすめします。<br>'
   + (Number(d.qty) >= 2
        ? '  ・お連れ様（'+Number(d.qty)+'名分）もこの1枚に含まれています。ご一緒にお越しください。<br>'
        : '')
   + '  ・画面が開けない場合も、受付でお名前をお伝えいただければご入場いただけます。'
   + '</div>'
   /* お問い合わせの入口。メールへの返信は運営が見落とすため、フォームを一次窓口にする
      （2026-08-03）。この画面は当日までに必ず開かれるので、導線としてここが一番強い。
      ?t= を付けて渡すと、フォーム側でどの注文かが分かる＝注文番号を打たせずに済む。 */
   + '<div class="notes">'
   + '  <b>お問い合わせ</b><br>'
   + '  ご不明な点や、お席・お支払いについてのご相談は、下記のフォームから承ります。<br>'
   + '  <a href="contact.html?t='+encodeURIComponent(d.token)+'">お問い合わせフォームを開く</a><br>'
   + '  <span style="font-size:11.5px">お急ぎの場合は <a href="mailto:info@haribow.com">info@haribow.com</a> まで。</span>'
   + '</div>';
  document.getElementById('root').innerHTML=html;

  // QRは端末内で生成（外部サービスに情報を渡さない）
  var qr=qrcode(0,'M');           // 型番自動・誤り訂正M（多少汚れても読める）
  qr.addData(d.token);
  qr.make();
  document.getElementById('qr').innerHTML=qr.createImgTag(6,0);
}

if(!token){
  msg('チケットが見つかりません','購入完了メールに記載のURLからお開きください。');
} else {
  fetch(BASE+'?page=ticket&t='+encodeURIComponent(token))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d && d.ok){ render(d); }
      else if(d && d.error==='unpaid'){
        msg('お支払いの確認前です','ご入金を確認しましたら、こちらにチケットが表示されます。');
      } else if(d && d.error==='voided'){
        msg('このチケットは無効です','お心当たりがない場合は info@haribow.com までご連絡ください。');
      } else {
        msg('チケットが見つかりません','URLをもう一度ご確認ください。<br>ご不明な場合は info@haribow.com まで。');
      }
    })
    .catch(function(){
      msg('通信エラーが発生しました','電波の良い場所で再度お試しください。<br>当日は受付でお名前をお伝えいただければご入場いただけます。');
    });
}
</script>
</body>
</html>
