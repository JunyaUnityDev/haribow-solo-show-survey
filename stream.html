<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>視聴ページ｜HARIBOW「Go Beyond」配信</title>
<style>
  :root{ --bg:#0a0b0e; --panel:#14161c; --line:#2a2d35; --ink:#f3f1ea; --faint:#8b919e; --main:#c9a24b; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:28px 18px 80px}
  .brand{font-size:12px;letter-spacing:.4em;color:var(--faint);font-weight:700;margin-bottom:8px}
  h1{font-size:20px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
  .lbl{font-size:11px;color:var(--faint);letter-spacing:.12em;font-weight:700;margin-bottom:4px}
  .big{font-size:17px;font-weight:700;line-height:1.6;word-break:break-all}
  .watch{display:block;text-align:center;background:var(--main);color:#14161c;font-weight:800;
    font-size:17px;border-radius:11px;padding:16px;text-decoration:none;margin:6px 0}
  .wait{border:1px dashed var(--line);border-radius:11px;padding:16px;text-align:center;color:var(--faint);font-size:14px;line-height:1.9}
  .note{font-size:12.5px;color:var(--faint);line-height:1.9}
  a{color:var(--main)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">HARIBOW — GO BEYOND</div>
  <h1>配信 視聴ページ</h1>
  <div id="body"><p class="note">読み込んでいます…（最初の1回だけ20秒ほどかかります）</p></div>
</div>
<script>
var BASE='https://script.google.com/macros/s/AKfycbyPtSUbVfZX9keG6E9jP9EfVSjy9DoA6onp_FgXPM3tbjLz2gm5UNcxaeqSyzIIbPFW/exec';
var T=new URLSearchParams(location.search).get('t')||'';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function load(){
  if(!T){ document.getElementById('body').innerHTML='<p class="note">チケットの識別コードがありません。メールに記載のURLをそのまま開いてください。</p>'; return; }
  fetch(BASE+'?page=ticket&t='+encodeURIComponent(T)+'&r='+Date.now())
  .then(function(r){return r.json();}).then(function(d){
    var el=document.getElementById('body');
    if(!d || !d.ok){
      el.innerHTML='<p class="note">'+(d&&d.error==='unpaid'
        ? 'お支払いの確認がまだ取れていません。決済がお済みの場合、1時間以内に自動で有効になります。'
        : 'チケットが見つかりませんでした。メールのURLをご確認いただくか、info@haribow.com までご連絡ください。')+'</p>';
      return;
    }
    var h='<div class="card"><div class="lbl">お名前</div><div class="big">'+esc(d.name)+' 様</div>'
      +'<div class="lbl" style="margin-top:12px">ご購入内容</div><div class="note">'+esc(d.breakdown)+'</div></div>';
    h+='<div class="card"><div class="lbl">公演</div><div class="note">'
      +esc(d.show&&d.show.date||'2026年9月29日(火)')+'　開演 '+esc(d.show&&d.show.start||'19:30')+'<br>'
      +'配信開始は開演の少し前を予定しています。</div></div>';
    if(d.stream && d.stream.ready){
      h+='<div class="card"><div class="lbl">視聴はこちら</div>'
        +'<a class="watch" href="'+esc(d.stream.url)+'">▶ 配信を開く</a>'
        +(d.stream.password ? '<div class="note">パスワード: <b>'+esc(d.stream.password)+'</b></div>' : '')
        +'<p class="note">アーカイブも同じURLで '+esc(d.stream.archiveUntil)+' までご覧いただけます。<br>'
        +'本番中にURLが開けなくなった場合は、このページを開き直してください。予備URLに切り替わります。</p></div>';
      if(d.stream.backup){
        h+='<div class="card"><div class="lbl">予備URL</div><div class="note"><a href="'+esc(d.stream.backup)+'">'+esc(d.stream.backup)+'</a></div></div>';
      }
    } else {
      h+='<div class="card"><div class="lbl">視聴URL</div>'
        +'<div class="wait">視聴URLは <b>9/28（公演前日）</b>までにここに表示されます。<br>'
        +'メールでもお送りします。このページをブックマークしておいてください。</div></div>';
    }
    h+='<p class="note">ご家族・チームのみなさんと同じ画面での鑑賞も歓迎です。<br>'
      +'お困りのことは <a href="contact.html">お問い合わせフォーム</a> または info@haribow.com へ。</p>';
    el.innerHTML=h;
  }).catch(function(){ document.getElementById('body').innerHTML='<p class="note">通信エラーです。再読み込みしてください。</p>'; });
}
load();
</script>
</body>
</html>
